<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOODIE Kids 🎈</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
:root {
  --kids-bg: #0d1b2a;
  --kids-blue: #4fc3f7;
  --kids-yellow: #ffd60a;
  --kids-pink: #f48fb1;
  --kids-green: #69f0ae;
  --kids-purple: #ce93d8;
  --kids-orange: #ffb74d;
  --text: #fff;
  --text2: rgba(255,255,255,0.7);
  --card-bg: rgba(255,255,255,0.06);
  --radius: 20px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Nunito', sans-serif;
  background: var(--kids-bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Animated bg stars */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background-image:
    radial-gradient(2px 2px at 10% 20%, rgba(255,255,255,0.4), transparent),
    radial-gradient(2px 2px at 80% 10%, rgba(255,255,255,0.3), transparent),
    radial-gradient(1px 1px at 50% 70%, rgba(255,255,255,0.5), transparent),
    radial-gradient(2px 2px at 30% 90%, rgba(255,255,255,0.2), transparent),
    radial-gradient(1px 1px at 90% 80%, rgba(255,255,255,0.4), transparent);
  pointer-events: none;
}

/* NAV */
.kids-nav {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 32px;
  background: rgba(13,27,42,0.9);
  backdrop-filter: blur(20px);
  border-bottom: 2px solid rgba(255,255,255,0.1);
}
.kids-logo {
  font-family: 'Fredoka One', cursive;
  font-size: 2rem; letter-spacing: 0.05em;
  background: linear-gradient(135deg, var(--kids-yellow), var(--kids-orange), var(--kids-pink));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  text-decoration: none;
}
.kids-logo-badge {
  font-size: 0.75rem; font-weight: 900;
  background: var(--kids-yellow); color: #000;
  padding: 2px 10px; border-radius: 99px;
  margin-left: 8px; vertical-align: middle;
  -webkit-text-fill-color: #000;
}
.back-home {
  background: rgba(255,255,255,0.1);
  border: 2px solid rgba(255,255,255,0.2);
  color: white; padding: 8px 20px; border-radius: 99px;
  font-size: 0.85rem; font-weight: 700; cursor: pointer;
  text-decoration: none; transition: all 0.2s;
}
.back-home:hover { background: rgba(255,255,255,0.2); }

/* HERO */
.kids-hero {
  position: relative; z-index: 1;
  text-align: center; padding: 60px 24px 40px;
}
.kids-hero-title {
  font-family: 'Fredoka One', cursive;
  font-size: clamp(2.5rem, 7vw, 5rem);
  line-height: 1.1; margin-bottom: 16px;
  background: linear-gradient(135deg, var(--kids-yellow) 0%, var(--kids-orange) 40%, var(--kids-pink) 80%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 30px rgba(255,214,10,0.3));
}
.kids-hero-sub { color: var(--text2); font-size: 1.1rem; font-weight: 600; margin-bottom: 32px; }

/* SEARCH */
.kids-search-wrap {
  display: flex; max-width: 500px; margin: 0 auto 16px;
  background: rgba(255,255,255,0.1);
  border: 2px solid rgba(255,255,255,0.2);
  border-radius: 99px; overflow: hidden;
  transition: border-color 0.3s;
}
.kids-search-wrap:focus-within { border-color: var(--kids-yellow); }
.kids-search {
  flex: 1; background: none; border: none; outline: none;
  color: white; font-size: 1rem; font-family: 'Nunito', sans-serif; font-weight: 700;
  padding: 14px 20px;
}
.kids-search::placeholder { color: rgba(255,255,255,0.4); }
.kids-search-btn {
  background: var(--kids-yellow); border: none;
  padding: 14px 24px; cursor: pointer;
  font-size: 1.2rem; font-weight: 900;
  color: #000; transition: background 0.2s;
}
.kids-search-btn:hover { background: var(--kids-orange); }

/* AGE FILTERS */
.age-filters {
  display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
  margin-bottom: 40px; padding: 0 24px;
}
.age-btn {
  background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.15);
  color: white; padding: 8px 20px; border-radius: 99px;
  font-family: 'Nunito', sans-serif; font-size: 0.85rem; font-weight: 800;
  cursor: pointer; transition: all 0.2s; letter-spacing: 0.05em;
}
.age-btn:hover, .age-btn.active { background: var(--kids-yellow); border-color: var(--kids-yellow); color: #000; }

/* CATEGORIES */
.category-tabs {
  display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
  padding: 0 24px 32px;
}
.cat-tab {
  background: var(--card-bg); border: 2px solid rgba(255,255,255,0.1);
  color: white; padding: 12px 24px; border-radius: 99px;
  font-family: 'Nunito', sans-serif; font-size: 0.9rem; font-weight: 800;
  cursor: pointer; transition: all 0.25s; letter-spacing: 0.05em;
}
.cat-tab:hover { transform: scale(1.05); }
.cat-tab[data-color="blue"]:hover, .cat-tab[data-color="blue"].active { background: var(--kids-blue); border-color: var(--kids-blue); color: #000; }
.cat-tab[data-color="green"]:hover, .cat-tab[data-color="green"].active { background: var(--kids-green); border-color: var(--kids-green); color: #000; }
.cat-tab[data-color="pink"]:hover, .cat-tab[data-color="pink"].active { background: var(--kids-pink); border-color: var(--kids-pink); color: #000; }
.cat-tab[data-color="purple"]:hover, .cat-tab[data-color="purple"].active { background: var(--kids-purple); border-color: var(--kids-purple); color: #000; }
.cat-tab[data-color="orange"]:hover, .cat-tab[data-color="orange"].active { background: var(--kids-orange); border-color: var(--kids-orange); color: #000; }

/* SECTIONS */
.kids-section { padding: 0 32px 40px; position:relative; z-index:1; }
.kids-section-title {
  font-family: 'Fredoka One', cursive;
  font-size: 1.5rem; margin-bottom: 20px;
  display: flex; align-items: center; gap: 10px;
}
.kids-scroll {
  display: flex; gap: 16px; overflow-x: auto; padding-bottom: 8px;
  scrollbar-width: none;
}
.kids-scroll::-webkit-scrollbar { display:none; }

/* KIDS CARD */
.kids-card {
  flex: 0 0 160px; border-radius: var(--radius);
  overflow: hidden; cursor: pointer; position: relative;
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  border: 2px solid rgba(255,255,255,0.1);
}
.kids-card:hover {
  transform: scale(1.08) translateY(-6px);
  border-color: var(--kids-yellow);
  box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 30px rgba(255,214,10,0.3);
}
.kids-card img {
  width: 100%; aspect-ratio: 2/3; object-fit: cover; display:block;
  background: rgba(255,255,255,0.05);
}
.kids-card-overlay {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
  padding: 16px 12px 12px;
  opacity: 0; transition: opacity 0.3s;
}
.kids-card:hover .kids-card-overlay { opacity: 1; }
.kids-card-title { font-size: 0.8rem; font-weight: 800; margin-bottom: 6px; }
.kids-play-btn {
  background: var(--kids-yellow); border: none;
  color: #000; width: 36px; height: 36px; border-radius: 50%;
  font-size: 0.9rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto;
}
.kids-rating {
  position: absolute; top: 8px; right: 8px;
  background: rgba(0,0,0,0.7); border-radius: 99px;
  padding: 3px 8px; font-size: 0.65rem; font-weight: 800;
  color: var(--kids-yellow);
}

/* Player */
.kids-player-page {
  display: none; position: fixed; inset: 0; z-index: 3000;
  background: #000; flex-direction: column;
}
.kids-player-page.open { display: flex; }
.kids-player-nav {
  height: 60px; background: #0d1b2a;
  display: flex; align-items: center; gap: 16px;
  padding: 0 24px; border-bottom: 2px solid rgba(255,255,255,0.1);
  flex-shrink: 0;
}
.kids-back-btn {
  background: var(--kids-yellow); border: none; color: #000;
  padding: 8px 20px; border-radius: 99px;
  font-family: 'Nunito', sans-serif; font-size: 0.85rem; font-weight: 800;
  cursor: pointer; transition: all 0.2s;
}
.kids-back-btn:hover { background: var(--kids-orange); }
.lock-btn {
  margin-left: auto;
  background: rgba(255,100,100,0.2); border: 2px solid rgba(255,100,100,0.5);
  color: #ff6b6b; padding: 8px 18px; border-radius: 99px;
  font-family: 'Nunito', sans-serif; font-size: 0.82rem; font-weight: 800;
  cursor: pointer; transition: all 0.2s;
}
.lock-btn.locked { background: rgba(255,214,10,0.2); border-color: rgba(255,214,10,0.5); color: var(--kids-yellow); }
.kids-frame-wrap { flex: 1; position: relative; }
.kids-frame-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
.kids-lock-overlay { position: absolute; inset: 0; z-index: 10; display: none; cursor: none; }
.kids-lock-overlay.active { display: block; }

/* Footer */
.kids-footer {
  text-align: center; padding: 32px;
  border-top: 1px solid rgba(255,255,255,0.1);
  color: var(--text2); font-size: 0.8rem;
  position: relative; z-index: 1;
}
.kids-footer a { color: var(--kids-yellow); text-decoration: none; }
</style>
</head>
<body>

<nav class="kids-nav">
  <a href="index.html" class="kids-logo" style="text-decoration:none">
    M◉ODIE<span class="kids-logo-badge">KIDS</span>
  </a>
  <a href="index.html" class="back-home">← Back to MOODIE</a>
</nav>

<section class="kids-hero">
  <h1 class="kids-hero-title">🎬 MOODIE KIDS 🌟</h1>
  <p class="kids-hero-sub">A magical world of movies just for you! 🚀✨</p>
  <div class="kids-search-wrap">
    <input type="text" class="kids-search" id="kids-search" placeholder="🔍 Search cartoons, movies...">
    <button class="kids-search-btn" onclick="kidsSearch()">GO!</button>
  </div>
</section>

<div class="age-filters">
  <button class="age-btn active" onclick="setAge(this, null)">All Ages</button>
  <button class="age-btn" onclick="setAge(this, 'toddler')">👶 2-4 Years</button>
  <button class="age-btn" onclick="setAge(this, 'kids')">🧒 5-8 Years</button>
  <button class="age-btn" onclick="setAge(this, 'tween')">👦 9-12 Years</button>
</div>

<div class="category-tabs">
  <button class="cat-tab active" data-color="blue" onclick="loadKidsGenre(this, 16)">🎨 Animation</button>
  <button class="cat-tab" data-color="green" onclick="loadKidsGenre(this, 10751)">👨‍👩‍👧 Family</button>
  <button class="cat-tab" data-color="pink" onclick="loadKidsGenre(this, 35)">😂 Comedy</button>
  <button class="cat-tab" data-color="purple" onclick="loadKidsGenre(this, 14)">🧙 Fantasy</button>
  <button class="cat-tab" data-color="orange" onclick="loadKidsGenre(this, 12)">🏔 Adventure</button>
</div>

<!-- Search Results -->
<section class="kids-section" id="kids-search-section" style="display:none">
  <h2 class="kids-section-title">🔍 Search Results</h2>
  <div class="kids-scroll" id="kids-search-grid"></div>
</section>

<!-- Animated Movies -->
<section class="kids-section" id="anim-section">
  <h2 class="kids-section-title">🎨 Animated Movies</h2>
  <div class="kids-scroll" id="anim-row"></div>
</section>

<!-- Family -->
<section class="kids-section" id="family-section">
  <h2 class="kids-section-title">👨‍👩‍👧 Family Movies</h2>
  <div class="kids-scroll" id="family-row"></div>
</section>

<!-- Adventure -->
<section class="kids-section" id="adv-section">
  <h2 class="kids-section-title">🏔 Adventure</h2>
  <div class="kids-scroll" id="adv-row"></div>
</section>

<!-- Fantasy -->
<section class="kids-section" id="fantasy-section">
  <h2 class="kids-section-title">🧙 Fantasy & Magic</h2>
  <div class="kids-scroll" id="fantasy-row"></div>
</section>

<!-- Player -->
<div class="kids-player-page" id="kids-player">
  <div class="kids-player-nav">
    <button class="kids-back-btn" onclick="closeKidsPlayer()">← Back</button>
    <span id="kids-player-title" style="font-weight:800;font-size:0.95rem;flex:1;padding:0 16px"></span>
    <button class="lock-btn" id="kids-lock-btn" onclick="toggleKidsLock()">🔒 Child Lock</button>
  </div>
  <div class="kids-frame-wrap">
    <div class="kids-lock-overlay" id="kids-lock-overlay"></div>
    <iframe id="kids-iframe" allowfullscreen allow="autoplay; encrypted-media" sandbox="allow-scripts allow-same-origin allow-presentation allow-popups"></iframe>
  </div>
</div>

<footer class="kids-footer">
  <p>MOODIE Kids — Safe entertainment for young viewers 🌟 | <a href="index.html">Back to MOODIE Cinema</a> | <a href="disclaimer.html">Disclaimer</a></p>
</footer>

<script>
const TMDB_TOKEN = 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJkYTg3MzU4ZmUxNWU5MTMxNWIxM2MwYjFmNDM5YjhmZCIsIm5iZiI6MTc3NzI1NzU2My41MjcsInN1YiI6IjY5ZWVjYzViNDk4Y2YxNDA2NjAyOTkzMCIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.TQ6XojRk4ejK4DawXrMJ0tH-6enYdAkD-3wuqUGrcSs';
const TMDB_API = 'https://api.themoviedb.org/3';
const IMG = 'https://image.tmdb.org/t/p/';
const HEADERS = { Authorization: `Bearer ${TMDB_TOKEN}` };
const SERVERS = [
  (id) => `https://vidsrc.pro/embed/movie/${id}`,
  (id) => `https://vidsrc.to/embed/movie/${id}`,
  (id) => `https://multiembed.mov/?video_id=${id}&tmdb=1`,
];

async function tmdb(ep) {
  const res = await fetch(`${TMDB_API}${ep}&language=en-US`, { headers: HEADERS });
  return res.json();
}

function kidsCardHTML(m) {
  const poster = m.poster_path ? `${IMG}w342${m.poster_path}` : '';
  const title = m.title || m.name || '';
  const rating = m.vote_average?.toFixed(1) || '?';
  return `
    <div class="kids-card" onclick="kidsPlay(${m.id}, '${encodeURIComponent(title)}')">
      <span class="kids-rating">★${rating}</span>
      <img src="${poster}" alt="${title}" loading="lazy" onerror="this.src='https://via.placeholder.com/342x513/1a2744/4fc3f7?text=${encodeURIComponent(title.slice(0,15))}'">
      <div class="kids-card-overlay">
        <div class="kids-card-title">${title}</div>
        <button class="kids-play-btn">▶</button>
      </div>
    </div>
  `;
}

async function loadKidsRow(rowId, endpoint) {
  const row = document.getElementById(rowId);
  if (!row) return;
  try {
    const data = await tmdb(endpoint);
    row.innerHTML = (data.results || []).slice(0, 20).map(kidsCardHTML).join('');
  } catch(e) {}
}

async function init() {
  await Promise.all([
    loadKidsRow('anim-row', '/discover/movie?with_genres=16&certification_country=US&certification.lte=PG&sort_by=popularity.desc?'),
    loadKidsRow('family-row', '/discover/movie?with_genres=10751&sort_by=popularity.desc?'),
    loadKidsRow('adv-row', '/discover/movie?with_genres=12,10751&sort_by=popularity.desc?'),
    loadKidsRow('fantasy-row', '/discover/movie?with_genres=14,10751&sort_by=popularity.desc?'),
  ]);
}

async function loadKidsGenre(btn, genreId) {
  document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const rows = ['anim-section','family-section','adv-section','fantasy-section'];
  rows.forEach(id => document.getElementById(id).style.display = 'none');
  document.getElementById('anim-section').style.display = 'block';
  document.getElementById('anim-section').querySelector('h2').textContent = btn.textContent;
  loadKidsRow('anim-row', `/discover/movie?with_genres=${genreId}&sort_by=popularity.desc?`);
  setTimeout(() => rows.forEach(id => document.getElementById(id).style.display = 'block'), 100);
}

async function kidsSearch() {
  const q = document.getElementById('kids-search').value.trim();
  if (!q) return;
  const section = document.getElementById('kids-search-section');
  const grid = document.getElementById('kids-search-grid');
  section.style.display = 'block';
  grid.innerHTML = '<p style="color:rgba(255,255,255,0.5)">Searching...</p>';
  section.scrollIntoView({ behavior:'smooth' });
  try {
    const data = await tmdb(`/search/movie?query=${encodeURIComponent(q)}&`);
    grid.innerHTML = data.results.map(kidsCardHTML).join('');
  } catch(e) {}
}

function setAge(btn, age) {
  document.querySelectorAll('.age-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function kidsPlay(id, title) {
  const player = document.getElementById('kids-player');
  player.classList.add('open');
  document.getElementById('kids-player-title').textContent = decodeURIComponent(title);
  document.getElementById('kids-iframe').src = SERVERS[0](id);
}

function closeKidsPlayer() {
  document.getElementById('kids-player').classList.remove('open');
  document.getElementById('kids-iframe').src = '';
  const overlay = document.getElementById('kids-lock-overlay');
  overlay.classList.remove('active');
  document.getElementById('kids-lock-btn').classList.remove('locked');
  document.getElementById('kids-lock-btn').textContent = '🔒 Child Lock';
}

function toggleKidsLock() {
  const overlay = document.getElementById('kids-lock-overlay');
  const btn = document.getElementById('kids-lock-btn');
  if (overlay.classList.contains('active')) {
    overlay.classList.remove('active');
    btn.classList.remove('locked');
    btn.textContent = '🔒 Child Lock';
  } else {
    overlay.classList.add('active');
    btn.classList.add('locked');
    btn.textContent = '🔓 LOCKED';
  }
}

document.getElementById('kids-search').addEventListener('keypress', e => { if(e.key === 'Enter') kidsSearch(); });
init();
</script>
</body>
</html>
