<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOODIE — Premium Cinema Experience</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #070709; color: #f0ede8; font-family: 'Segoe UI', system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #070709; }
    ::-webkit-scrollbar-thumb { background: #c9a84c; border-radius: 4px; }

    #nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 900;
      padding: 0 4rem; height: 68px;
      display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(to bottom, rgba(7,7,9,0.98), transparent);
    }
    .nav-logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.9rem; color: #fff; letter-spacing: 0.12em; }
    .nav-logo span { color: #c9a84c; }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links li a { font-size: 0.82rem; color: rgba(240,237,232,0.45); text-decoration: none; text-transform: uppercase; }
    .search-input {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.07);
      border-radius: 50px; padding: 0.45rem 1rem; color: #f0ede8;
      width: 200px; outline: none;
    }
    .btn-kids {
      padding: 0.42rem 1.1rem; border: 1px solid #4a9eff;
      border-radius: 50px; background: none; color: #4a9eff; cursor: pointer;
    }

    #hero {
      position: relative; height: 100vh; min-height: 600px;
      display: flex; align-items: flex-end; overflow: hidden;
    }
    .hero-bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
    .hero-bg::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to top, #070709 0%, rgba(7,7,9,0.7) 40%, transparent 100%);
    }
    .hero-content { position: relative; z-index: 2; padding: 5rem; max-width: 680px; }
    .hero-title { font-family: 'Bebas Neue', sans-serif; font-size: 5rem; margin-bottom: 1rem; }
    .hero-desc { font-size: 0.92rem; line-height: 1.7; color: rgba(240,237,232,0.75); margin-bottom: 2rem; }
    .btn-play {
      background: #fff; color: #000; padding: 0.85rem 2.2rem;
      border: none; border-radius: 8px; font-weight: 600; cursor: pointer;
    }
    .btn-info {
      background: rgba(255,255,255,0.12); color: #fff; padding: 0.85rem 2rem;
      border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; cursor: pointer;
    }

    .section { padding: 3rem 4rem; }
    .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; margin-bottom: 1.5rem; }
    .section-title span { color: #c9a84c; }
    .movie-row {
      display: flex; gap: 1rem; overflow-x: auto; padding-bottom: 1rem;
    }
    .movie-row::-webkit-scrollbar { display: none; }
    .movie-card {
      flex: 0 0 180px; cursor: pointer; border-radius: 12px;
      overflow: hidden; background: #111118; position: relative;
      transition: transform 0.2s;
    }
    .movie-card:hover { transform: scale(1.05); }
    .movie-card-poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
    .movie-card-rating {
      position: absolute; top: 8px; right: 8px;
      background: rgba(0,0,0,0.75); border-radius: 6px;
      padding: 0.2rem 0.5rem; font-size: 0.68rem; color: #c9a84c;
    }
    .movie-card-play-btn {
      position: absolute; bottom: 10px; left: 50%;
      transform: translateX(-50%); background: rgba(255,255,255,0.9);
      border: none; width: 40px; height: 40px; border-radius: 50%;
      cursor: pointer; opacity: 0; transition: opacity 0.2s;
    }
    .movie-card:hover .movie-card-play-btn { opacity: 1; }
    .movie-card-title { padding: 10px; font-size: 0.8rem; text-align: center; }

    #player-modal {
      display: none; position: fixed; inset: 0; z-index: 10000;
      background: #000; align-items: center; justify-content: center;
    }
    #player-modal.open { display: flex; }
    .player-container {
      width: 90%; max-width: 1000px; background: #000;
      border-radius: 16px; overflow: hidden;
    }
    .player-header {
      padding: 15px 20px; background: #111;
      display: flex; justify-content: space-between;
    }
    .player-close {
      background: #E50914; border: none; color: white;
      padding: 5px 15px; border-radius: 50px; cursor: pointer;
    }

    #detail-modal {
      display: none; position: fixed; inset: 0; z-index: 950;
      background: rgba(0,0,0,0.85); align-items: center; justify-content: center;
    }
    #detail-modal.open { display: flex; }
    .detail-box {
      width: 90%; max-width: 800px; background: #13131c;
      border-radius: 20px; overflow: hidden;
    }
    .detail-body { padding: 1.5rem; }

    #kids-mode {
      display: none; position: fixed; inset: 0; z-index: 800;
      background: #0a1628; overflow-y: auto;
    }
    #kids-mode.active { display: block; }
    .kids-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1rem; padding: 2rem;
    }

    #toast {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
      background: #1a1a26; border-radius: 50px; padding: 0.7rem 1.5rem;
      z-index: 9999; opacity: 0; transition: opacity 0.3s;
    }
    #toast.show { opacity: 1; }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .hero-content { padding: 2rem; }
      .hero-title { font-size: 2.5rem; }
      .section { padding: 2rem; }
    }
  </style>
</head>
<body>

<div id="splash" style="position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;animation:splashOut 0.8s ease 3.2s forwards">
  <div style="font-family:'Bebas Neue',sans-serif;font-size:5rem;color:#fff;animation:splashLogoIn 1s ease 0.5s forwards;opacity:0">M<span style="color:#c9a84c">OO</span>DIE</div>
</div>
<style>
  @keyframes splashLogoIn { to { opacity: 1; } }
  @keyframes splashOut { to { opacity: 0; pointer-events: none; } }
</style>

<nav id="nav">
  <div class="nav-logo">M<span>OO</span>DIE</div>
  <ul class="nav-links">
    <li><a href="#">الرئيسية</a></li>
    <li><a href="#movies">أفلام</a></li>
    <li><a href="#trending">الأكثر مشاهدة</a></li>
  </ul>
  <div class="nav-right" style="display:flex;gap:1rem;align-items:center">
    <input class="search-input" type="text" placeholder="ابحث عن فيلم..." id="searchInput">
    <button class="btn-kids" onclick="openKidsMode()">🌟 Kids</button>
  </div>
</nav>

<section id="hero">
  <div class="hero-bg" id="heroBg"></div>
  <div class="hero-content">
    <h1 class="hero-title" id="heroTitle">MOODIE</h1>
    <p class="hero-desc" id="heroDesc">جارٍ التحميل...</p>
    <button class="btn-play" onclick="openMoviePlayer()">▶ شغّل الآن</button>
    <button class="btn-info" onclick="openDetail(currentHeroMovie)">⊕ معلومات</button>
  </div>
</section>

<main>
  <div class="section" id="movies">
    <div class="section-title">الأفلام <span>الشائعة</span></div>
    <div class="movie-row" id="moviesRow"></div>
  </div>
  <div class="section" id="trending">
    <div class="section-title">الأكثر <span>مشاهدة</span></div>
    <div class="movie-row" id="trendingRow"></div>
  </div>
</main>

<footer style="padding:2rem 4rem;border-top:1px solid rgba(255,255,255,0.07);margin-top:2rem">
  <div style="font-family:'Bebas Neue',sans-serif;font-size:1.5rem">M<span style="color:#c9a84c">OO</span>DIE</div>
  <div style="font-size:0.75rem;color:#666;margin-top:1rem">© 2025 MOODIE Cinema.</div>
</footer>

<div id="player-modal">
  <div class="player-container">
    <div class="player-header">
      <span style="color:#c9a84c">🎬 MOODIE PREMIUM</span>
      <button class="player-close" onclick="closePlayerModal()">✕ إغلاق</button>
    </div>
    <div id="playerContent" style="aspect-ratio:16/9;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;text-align:center">
      <div style="font-size:3rem">🎥</div>
      <div id="playerMsg">جارٍ تجهيز المشغل...</div>
      <button id="playerBtn" style="display:none;background:#c9a84c;border:none;color:#000;padding:12px 30px;border-radius:50px;cursor:pointer;font-weight:bold" onclick="openExternal()">▶ مشاهدة الفيلم</button>
    </div>
  </div>
</div>

<div id="detail-modal">
  <div class="detail-box">
    <button style="position:absolute;top:1rem;right:1rem;background:rgba(0,0,0,0.7);border:none;color:white;width:36px;height:36px;border-radius:50%;cursor:pointer" onclick="closeDetail()">✕</button>
    <img id="detailBackdrop" style="width:100%;aspect-ratio:16/9;object-fit:cover;opacity:0.6">
    <div class="detail-body">
      <h1 id="detailTitle" style="font-family:'Bebas Neue',sans-serif;font-size:2.5rem">—</h1>
      <p id="detailOverview" style="margin:1rem 0;line-height:1.7">—</p>
      <button class="btn-play" onclick="openMoviePlayer()">▶ شغّل الآن</button>
    </div>
  </div>
</div>

<div id="kids-mode">
  <div style="padding:1rem 2rem;background:#0a1628;display:flex;justify-content:space-between">
    <div style="font-family:'Bebas Neue',sans-serif;font-size:2rem;color:#4a9eff">MOODIE KIDS</div>
    <button onclick="closeKidsMode()" style="background:none;border:1px solid #aaa;color:#aaa;padding:0.5rem 1rem;border-radius:50px;cursor:pointer">✕ خروج</button>
  </div>
  <div class="kids-grid" id="kidsGrid"></div>
</div>

<div id="toast"></div>

<script>
  const API_TOKEN = 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJkYTg3MzU4ZmUxNWU5MTMxNWIxM2MwYjFmNDM5YjhmZCIsIm5iZiI6MTc3NzI1NzU2My41MjcsInN1YiI6IjY5ZWVjYzViNDk4Y2YxNDA2NjAyOTkzMCIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.TQ6XojRk4ejK4DawXrMJ0tH-6enYdAkD-3wuqUGrcSs';
  const IMG_BASE = 'https://image.tmdb.org/t/p/';
  
  let currentHeroMovie = null;
  let heroMovies = [];
  let currentPlayerUrl = null;

  async function tmdb(endpoint) {
    const res = await fetch(`https://api.themoviedb.org/3${endpoint}`, {
      headers: { 'Authorization': `Bearer ${API_TOKEN}` }
    });
    return res.json();
  }

  function posterUrl(path) { return path ? `${IMG_BASE}w342${path}` : ''; }
  function backdropUrl(path) { return path ? `${IMG_BASE}original${path}` : ''; }

  async function loadHero() {
    try {
      const data = await tmdb('/movie/now_playing?language=ar&region=EG');
      heroMovies = data.results.filter(m => m.backdrop_path).slice(0,5);
      if(heroMovies.length) setHero(0);
    } catch(e) { console.warn(e); }
  }

  function setHero(index) {
    const m = heroMovies[index];
    if(!m) return;
    currentHeroMovie = m;
    document.getElementById('heroBg').style.backgroundImage = `url(${backdropUrl(m.backdrop_path)})`;
    document.getElementById('heroTitle').innerHTML = m.title;
    document.getElementById('heroDesc').innerHTML = m.overview || 'لا يوجد وصف';
  }

  async function loadMovies() {
    try {
      const [popular, trending] = await Promise.all([
        tmdb('/movie/popular?language=ar'),
        tmdb('/trending/movie/week?language=ar')
      ]);
      renderMovies('moviesRow', popular.results.slice(0,12));
      renderMovies('trendingRow', trending.results.slice(0,12));
    } catch(e) { console.warn(e); }
  }

  function renderMovies(containerId, movies) {
    const container = document.getElementById(containerId);
    if(!movies.length) { container.innerHTML = '<p>لا توجد أفلام</p>'; return; }
    container.innerHTML = movies.map(m => `
      <div class="movie-card" onclick='openDetail(${JSON.stringify(m)})'>
        <img class="movie-card-poster" src="${posterUrl(m.poster_path)}">
        <div class="movie-card-rating">⭐ ${(m.vote_average||0).toFixed(1)}</div>
        <button class="movie-card-play-btn" onclick="event.stopPropagation();playMovieNow(${JSON.stringify(m).replace(/"/g,'&quot;')})">▶</button>
        <div class="movie-card-title">${m.title}</div>
      </div>
    `).join('');
  }

  function playMovieNow(movie) {
    currentHeroMovie = movie;
    openMoviePlayer();
  }

  function openMoviePlayer() {
    if(!currentHeroMovie) { showToast('اختار فيلماً أولاً'); return; }
    const modal = document.getElementById('player-modal');
    const msg = document.getElementById('playerMsg');
    const btn = document.getElementById('playerBtn');
    
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
    
    const mediaType = currentHeroMovie.first_air_date ? 'tv' : 'movie';
    currentPlayerUrl = `https://vidsrc.xyz/embed/${mediaType}/${currentHeroMovie.id}`;
    msg.innerHTML = `⚠️ سيتم فتح الفيلم بجودة عالية<br>قد يظهر إعلان بسيط`;
    btn.style.display = 'block';
  }

  function closePlayerModal() {
    document.getElementById('player-modal').classList.remove('open');
    document.body.style.overflow = '';
  }

  function openExternal() {
    if(currentPlayerUrl) {
      window.open(currentPlayerUrl, '_blank');
      closePlayerModal();
    }
  }

  function openDetail(movie) {
    if(!movie) return;
    currentHeroMovie = movie;
    document.getElementById('detailTitle').innerHTML = movie.title;
    document.getElementById('detailOverview').innerHTML = movie.overview || 'لا يوجد وصف';
    document.getElementById('detailBackdrop').src = backdropUrl(movie.backdrop_path) || posterUrl(movie.poster_path);
    document.getElementById('detail-modal').style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }

  function closeDetail() {
    document.getElementById('detail-modal').style.display = 'none';
    document.body.style.overflow = '';
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerHTML = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  async function openKidsMode() {
    document.getElementById('kids-mode').classList.add('active');
    document.body.style.overflow = 'hidden';
    const grid = document.getElementById('kidsGrid');
    if(grid.children.length < 2) {
      const data = await tmdb('/discover/movie?with_genres=16&sort_by=popularity.desc');
      grid.innerHTML = data.results.slice(0,12).map(m => `
        <div class="kids-card" style="background:rgba(255,255,255,0.05);border-radius:16px;overflow:hidden;cursor:pointer" onclick='openDetail(${JSON.stringify(m)})'>
          <img src="${posterUrl(m.poster_path)}" style="width:100%;aspect-ratio:2/3;object-fit:cover">
          <div style="padding:0.5rem;text-align:center;font-size:0.75rem">${m.title}</div>
        </div>
      `).join('');
    }
  }

  function closeKidsMode() {
    document.getElementById('kids-mode').classList.remove('active');
    document.body.style.overflow = '';
  }

  const searchInput = document.getElementById('searchInput');
  searchInput.addEventListener('input', async (e) => {
    const q = e.target.value.trim();
    if(q.length < 2) { loadMovies(); return; }
    const data = await tmdb(`/search/movie?query=${encodeURIComponent(q)}&language=ar`);
    renderMovies('moviesRow', data.results.slice(0,12));
    document.getElementById('trendingRow').innerHTML = '';
  });

  document.addEventListener('DOMContentLoaded', () => {
    loadHero();
    loadMovies();
  });
</script>
</body>
      </html>
