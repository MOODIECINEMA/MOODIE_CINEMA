<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOODIE | عالمك السينمائي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --dark: #050505; --kids-color: #ff0055; }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; transition: 0.3s; }
        body { background: var(--dark); color: white; margin: 0; overflow-x: hidden; }

        /* الهيدر */
        header { 
            position: fixed; top: 0; width: 100%; height: 70px; 
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 5%; z-index: 1000; border-bottom: 1px solid rgba(212,175,55,0.2);
        }
        .logo { font-size: 30px; font-weight: 900; color: var(--gold); text-decoration: none; }

        /* واجهة البوسترات (اللي عاجبتك) */
        .hero { 
            height: 70vh; background: linear-gradient(to top, var(--dark), transparent), 
            url('https://images.unsplash.com/photo-1485846234645-a62644f84728?q=80&w=2059') center/cover;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
        .hero h1 { font-size: 50px; color: var(--gold); margin-bottom: 10px; }
        .hero p { font-size: 18px; color: #ccc; max-width: 500px; }

        /* ركن الأطفال (النسخة الجديدة) */
        #kids-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #00d2ff 0%, #3a7bd5 100%);
            z-index: 2000; display: none; padding: 50px;
        }
        .kids-header { display: flex; justify-content: space-between; align-items: center; color: white; }
        .close-kids { background: white; color: red; padding: 10px 20px; border-radius: 50px; cursor: pointer; font-weight: bold; }

        /* الأفلام */
        .movie-section { padding: 40px 5%; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .movie-card { 
            background: #111; border-radius: 15px; overflow: hidden; border: 1px solid #222;
            cursor: pointer; position: relative;
        }
        .movie-card:hover { transform: translateY(-10px); border-color: var(--gold); box-shadow: 0 10px 30px rgba(212,175,55,0.2); }
        .movie-card img { width: 100%; height: 300px; object-fit: cover; }
        .play-btn { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: var(--gold); color: black; width: 50px; height: 50px; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; font-size: 20px;
        }
        .movie-card:hover .play-btn { opacity: 1; visibility: visible; }

        /* مشغل الفيديو المخفي */
        #video-player {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 3000; display: none;
            justify-content: center; align-items: center;
        }
        .player-box { width: 90%; max-width: 1000px; position: relative; }
        iframe { width: 100%; aspect-ratio: 16/9; border: 2px solid var(--gold); border-radius: 15px; }
        .close-player { position: absolute; top: -40px; right: 0; color: white; cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">MOODIE</a>
        <button onclick="openKids()" style="background: var(--kids-color); color: white; border: none; padding: 10px 20px; border-radius: 50px; cursor: pointer; font-weight: bold;">🧒 ركن الأطفال</button>
    </header>

    <div class="hero">
        <h1>فيلمك موجود..</h1>
        <p>تخطى حدود الخيال مع مكتبة MOODIE الحصرية. اضغط على أي فيلم للمشاهدة فوراً.</p>
    </div>

    <section class="movie-section">
        <h2 style="color: var(--gold); border-right: 4px solid var(--gold); padding-right: 15px;">المضافة حديثاً</h2>
        <div class="movie-grid">
            <div class="movie-card" onclick="playMovie('https://www.youtube.com/embed/shW9i6k8cB0')">
                <img src="https://m.media-amazon.com/images/M/MV5BMjAxMzY3NjcxNF5BMl5BanBnXkFtZTcwNTI5OTM0Mw@@._V1_.jpg" alt="Inception">
                <div class="play-btn">▶</div>
            </div>
            <div class="movie-card" onclick="playMovie('https://www.youtube.com/embed/EXeTwQWrcwY')">
                <img src="https://m.media-amazon.com/images/M/MV5BMTMxNTMwODM0NF5BMl5BanBnXkFtZTcwODAyMTk2Mw@@._V1_.jpg" alt="The Dark Knight">
                <div class="play-btn">▶</div>
            </div>
            <div class="movie-card" onclick="playMovie('https://www.youtube.com/embed/zSWdZVtXT7E')">
                <img src="https://m.media-amazon.com/images/M/MV5BNDYxNjQyMjAtNTdiOS00NGYwLWFmNTAtNThmYjU5ZGI2YTI1XkEyXkFqcGdeQXVyMTMxODk2OTU@._V1_.jpg" alt="Interstellar">
                <div class="play-btn">▶</div>
            </div>
        </div>
    </section>

    <div id="kids-overlay">
        <div class="kids-header">
            <h1 style="font-size: 40px;">🌈 عالم مودي للأبطال 🍭</h1>
            <div class="close-kids" onclick="closeKids()">❌ خروج للسينما</div>
        </div>
        <div class="movie-grid" style="margin-top: 50px;">
            <div class="movie-card" onclick="playMovie('https://www.youtube.com/embed/v-PjgYDrg70')" style="border-color: yellow;">
                <img src="https://m.media-amazon.com/images/M/MV5BMjEwMzMxODIzOV5BMl5BanBnXkFtZTgwNzg3OTAzMDI@._V1_.jpg" alt="Toy Story">
            </div>
            <div class="movie-card" onclick="playMovie('https://www.youtube.com/embed/v-PjgYDrg70')" style="border-color: lime;">
                <img src="https://m.media-amazon.com/images/M/MV5BMTY1OTIwODgzMV5BMl5BanBnXkFtZTgwMzUyMDgzNzE@._V1_.jpg" alt="Nemo">
            </div>
        </div>
    </div>

    <div id="video-player">
        <div class="player-box">
            <span class="close-player" onclick="closePlayer()">✖ إغلاق المشغل</span>
            <iframe id="main-iframe" src="" allowfullscreen></iframe>
            <div style="margin-top: 10px; color: var(--gold); text-align: center;">جاري التشغيل على سرفر MOODIE الذهبي 📀</div>
        </div>
    </div>

    <script>
        function openKids() { document.getElementById('kids-overlay').style.display = 'block'; }
        function closeKids() { document.getElementById('kids-overlay').style.display = 'none'; }
        
        function playMovie(url) {
            document.getElementById('main-iframe').src = url;
            document.getElementById('video-player').style.display = 'flex';
        }
        
        function closePlayer() {
            document.getElementById('video-player').style.display = 'none';
            document.getElementById('main-iframe').src = '';
        }
    </script>

</body>
</html>
