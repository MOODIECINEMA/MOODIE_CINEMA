<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>VoltFlix | شاهد أحدث الأفلام والمسلسلات مجاناً</title>
    <link rel="icon" type="image/png" href="https://img.icons8.com/fluent/48/000000/movie-projector.png">
    
    <!-- SEO الماستر ليتصدر الموقع في جوجل -->
    <meta name="description" content="منصة VoltFlix لمشاهدة أحدث الأفلام والمسلسلات بجودة عالية وبدون إعلانات مزعجة.">
    <meta name="keywords" content="VoltFlix, فولت فليكس, أفلام ومسلسلات, مشاهدة أفلام اون لاين, نتفليكس مجانا">
    <meta name="robots" content="index, follow">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #E50914; 
            --bg-color: #141414; 
            --card-bg: #181818;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); overflow-x: hidden; }

        /* سبلش سكرين نتفليكس */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background-color: #000;
            z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        .splash-logo { color: var(--primary-color); font-size: 4.5rem; font-weight: 900; letter-spacing: 4px; animation: pulse 1.5s infinite alternate; }
        .loader-bar { width: 200px; height: 4px; background: #222; border-radius: 2px; overflow: hidden; margin-top: 20px; }
        .loader-progress { width: 0%; height: 100%; background: var(--primary-color); animation: load 2s ease-in-out forwards; }

        /* نيفبار كامل */
        header {
            position: fixed; top: 0; left: 0; width: 100%; padding: 20px 4%;
            display: flex; justify-content: space-between; align-items: center; z-index: 1000;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%); transition: 0.4s;
        }
        header.scrolled { background-color: var(--bg-color); padding: 15px 4%; border-bottom: 1px solid #252525; }
        .nav-right { display: flex; align-items: center; gap: 30px; }
        .logo { color: var(--primary-color); font-size: 2.2rem; font-weight: 900; text-decoration: none; }
        
        /* شريط البحث الذكي */
        .search-box { display: flex; align-items: center; background: rgba(0,0,0,0.6); border: 1px solid #555; padding: 6px 12px; border-radius: 4px; }
        .search-box input { background: transparent; border: none; color: #fff; outline: none; padding-right: 10px; width: 200px; transition: 0.4s; }
        .search-box input:focus { width: 280px; }
        .search-box i { color: #fff; }

        /* الهيرو البانر الضخم فوق */
        .hero {
            position: relative; height: 85vh; display: flex; align-items: center; padding: 0 4%;
            background-size: cover; background-position: center center;
        }
        .hero::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to right, rgba(20,20,20,0.9) 30%, transparent 100%), linear-gradient(to top, var(--bg-color) 0%, transparent 30%);
        }
        .hero-content { position: relative; z-index: 10; max-width: 700px; }
        .hero-title { font-size: 3.8rem; font-weight: 900; margin-bottom: 15px; }
        .hero-overview { font-size: 1.1rem; color: #e5e5e5; margin-bottom: 25px; line-height: 1.6; }
        
        .btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 28px; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; }
        .btn-primary { background-color: #fff; color: #000; }
        .btn-secondary { background-color: rgba(109,109,110,0.7); color: #fff; margin-right: 10px; }

        /* صفوف البوسترات الأفقية (Netflix Rows) */
        .main-layout { padding: 0 0 50px 0; margin-top: -60px; position: relative; z-index: 20; }
        .movie-row { margin-bottom: 30px; padding-right: 4%; }
        .row-title { font-size: 1.4rem; margin-bottom: 12px; font-weight: 700; }
        .posters-container { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; scroll-behavior: smooth; }
        .posters-container::-webkit-scrollbar { height: 6px; }
        .posters-container::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        
        .movie-card { min-width: 180px; width: 180px; height: 260px; background-color: var(--card-bg); border-radius: 4px; overflow: hidden; cursor: pointer; transition: transform 0.3s ease; position: relative; }
        .movie-card:hover { transform: scale(1.08); z-index: 50; }
        .movie-card img { width: 100%; height: 100%; object-fit: cover; }
        .card-overlay { position: absolute; bottom: 0; left: 0; width: 100%; padding: 10px; background: linear-gradient(to top, #000, transparent); opacity: 0; transition: 0.3s; }
        .movie-card:hover .card-overlay { opacity: 1; }

        /* البحث */
        #search-results-section { display: none; padding: 100px 4% 50px 4%; }
        .search-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }

        /* الكارت الضخم والمشغل الكاملا */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); z-index: 2000; display: flex; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: 0.3s; }
        .modal.open { opacity: 1; visibility: visible; }
        .modal-content { background-color: var(--card-bg); width: 90%; max-width: 850px; border-radius: 6px; overflow: hidden; position: relative; max-height: 90vh; overflow-y: auto; }
        .modal-banner { position: relative; height: 380px; background-size: cover; background-position: center; }
        .modal-banner::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, var(--card-bg) 0%, transparent 100%); }
        .close-modal { position: absolute; top: 20px; right: 20px; background: #000; color: #fff; border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; z-index: 100; }
        
        .video-box { display: none; width: 100%; height: 450px; background: #000; }
        .video-box iframe { width: 100%; height: 100%; border: none; }

        .modal-body { padding: 25px; display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }
        .detail-title { font-size: 2.2rem; font-weight: 900; margin-bottom: 10px; }
        .detail-overview { color: #e5e5e5; line-height: 1.6; margin-bottom: 20px; }
        .meta-info p { margin-bottom: 10px; }
        .green-meta { color: #46d369; font-weight: bold; }

        @keyframes load { from { width: 0%; } to { width: 100%; } }
        @keyframes pulse { from { transform: scale(0.98); opacity: 0.8; } to { transform: scale(1.02); opacity: 1; } }
        @media(max-width: 768px) { .modal-body { grid-template-columns: 1fr; } .video-box { height: 260px; } .hero-title { font-size: 2.2rem; } }
    </style>
</head>
<body>

    <!-- السبلش سكرين -->
    <div id="splash-screen">
        <div class="splash-logo">VOLTFLIX</div>
        <div class="loader-bar">
            <div class="loader-progress"></div>
        </div>
    </div>

    <!-- الهيدر -->
    <header id="main-header">
        <div class="nav-right">
            <a href="#" class="logo" onclick="window.location.reload();">VOLTFLIX</a>
        </div>
        <div class="nav-left">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="ابحث عن الأفلام الحصرية...">
                <i class="fas fa-search"></i>
            </div>
        </div>
    </header>

    <!-- البحث -->
    <section id="search-results-section">
        <h2 class="row-title" id="search-query-title">نتائج البحث</h2>
        <div class="search-grid" id="search-grid-container"></div>
    </section>

    <!-- المحتوى الرئيسي للموقع -->
    <div id="main-content-wrapper">
        <section class="hero" id="hero-section">
            <div class="hero-content">
                <h1 class="hero-title" id="hero-title">تجهيز الواجهة الحصرية...</h1>
                <p class="hero-overview" id="hero-overview">...</p>
                <div>
                    <button class="btn btn-primary" id="hero-play-btn"><i class="fas fa-play"></i> تشغيل</button>
                </div>
            </div>
        </section>

        <main class="main-layout">
            <div class="movie-row">
                <h2 class="row-title">الأفلام الشائعة الآن</h2>
                <div class="posters-container" id="row-trending"></div>
            </div>
            <div class="movie-row">
                <h2 class="row-title">أفلام الحركة والإثارة (Action)</h2>
                <div class="posters-container" id="row-action"></div>
            </div>
            <div class="movie-row">
                <h2 class="row-title">الأعلى تقييماً عالمياً</h2>
                <div class="posters-container" id="row-top-rated"></div>
            </div>
        </main>
    </div>

    <!-- الكارت الفخم والمشغل المدمج -->
    <div class="modal" id="movie-modal">
        <div class="modal-content">
            <button class="close-modal" id="close-modal-btn"><i class="fas fa-times"></i></button>
            <div class="video-box" id="video-box-wrapper">
                <iframe id="video-iframe" allowfullscreen src=""></iframe>
            </div>
            <div class="modal-banner" id="modal-banner"></div>
            <div class="modal-body">
                <div>
                    <h2 class="detail-title" id="modal-title">-</h2>
                    <p class="detail-overview" id="modal-overview">-</p>
                    <button class="btn btn-primary" id="modal-play-btn" style="background-color: var(--primary-color); color: #fff;"><i class="fas fa-play"></i> تشغيل الفيلم كامل</button>
                </div>
                <div class="meta-info">
                    <p><span class="green-meta">التطابق: 99%</span></p>
                    <p><span>التقييم:</span> <span id="modal-rating" style="color: #ffc107; font-weight: bold;">0.0</span></p>
                    <p><span>تاريخ العرض:</span> <span id="modal-date">-</span></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 🛠️ هنا السر وتصليح الكود: فصلنا الـ Key النظيف عن الدوشة
        const API_KEY = 'da87358fe15e91315b13c0b1f439b8fd'; 
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/original';
        const POSTER_URL = 'https://image.tmdb.org/t/p/w500';

        // نيفبار شفاف وبيسود لما تنزل
        window.addEventListener('scroll', () => {
            const header = document.getElementById('main-header');
            if (window.scrollY > 40) header.classList.add('scrolled');
            else header.classList.remove('scrolled');
        });

        // جلب الداتا وبناء الصفوف الأفقية
        async function buildNetflixRow(endpoint, elementId, customParams = '') {
            try {
                const response = await fetch(`${BASE_URL}${endpoint}?api_key=${API_KEY}&language=ar${customParams}`);
                const data = await response.json();
                const movies = data.results;
                const container = document.getElementById(elementId);
                
                container.innerHTML = '';
                if(!movies || movies.length === 0) return [];

                movies.forEach(movie => {
                    if (!movie.poster_path || !movie.backdrop_path) return;
                    const card = document.createElement('div');
                    card.classList.add('movie-card');
                    card.innerHTML = `
                        <img src="${POSTER_URL}${movie.poster_path}" alt="${movie.title}">
                        <div class="card-overlay"><h4>${movie.title}</h4></div>
                    `;
                    card.addEventListener('click', () => openNetflixModal(movie));
                    container.appendChild(card);
                });
                return movies;
            } catch (err) {
                console.error("خطأ اتصال بالـ API:", err);
            }
        }

        function setupHeroBanner(movie) {
            const hero = document.getElementById('hero-section');
            hero.style.backgroundImage = `url('${IMG_URL}${movie.backdrop_path}')`;
            document.getElementById('hero-title').innerText = movie.title;
            document.getElementById('hero-overview').innerText = movie.overview ? movie.overview.substring(0, 180) + '...' : 'شاهد أقوى العروض الحصرية مباشرة بدون تقطيع اليوم.';
            document.getElementById('hero-play-btn').onclick = () => openNetflixModal(movie);
        }

        function openNetflixModal(movie) {
            const modal = document.getElementById('movie-modal');
            document.getElementById('video-box-wrapper').style.display = 'none';
            document.getElementById('video-iframe').src = '';
            document.getElementById('modal-banner').style.display = 'block';

            document.getElementById('modal-banner').style.backgroundImage = `url('${IMG_URL}${movie.backdrop_path}')`;
            document.getElementById('modal-title').innerText = movie.title;
            document.getElementById('modal-overview').innerText = movie.overview || 'فيلم رائع ومشوق متوفر الآن للمشاهدة الكاملة بـ دقة ممتازة وبأحدث الترجمات.';
            document.getElementById('modal-rating').innerText = movie.vote_average.toFixed(1);
            document.getElementById('modal-date').innerText = movie.release_date || 'عرض أول';

            document.getElementById('modal-play-btn').onclick = function() {
                document.getElementById('modal-banner').style.display = 'none';
                document.getElementById('video-box-wrapper').style.display = 'block';
                // مشغل احترافي بيشغل الفيلم كامل بناء على الآيدي
                document.getElementById('video-iframe').src = `https://vidsrc.to/embed/movie/${movie.id}`;
            };
            modal.classList.add('open');
        }

        document.getElementById('close-modal-btn').addEventListener('click', () => {
            document.getElementById('movie-modal').classList.remove('open');
            document.getElementById('video-iframe').src = '';
        });

        // نظام البحث الفوري والذكي
        const searchInput = document.getElementById('search-input');
        const mainWrapper = document.getElementById('main-content-wrapper');
        const searchSection = document.getElementById('search-results-section');
        const searchContainer = document.getElementById('search-grid-container');

        searchInput.addEventListener('input', async (e) => {
            const query = e.target.value.trim();
            if(query.length < 2) {
                searchSection.style.display = 'none';
                mainWrapper.style.display = 'block';
                return;
            }
            try {
                const res = await fetch(`${BASE_URL}/search/movie?api_key=${API_KEY}&language=ar&query=${encodeURIComponent(query)}`);
                const data = await res.json();
                const results = data.results;

                mainWrapper.style.display = 'none';
                searchSection.style.display = 'block';
                document.getElementById('search-query-title').innerText = `نتائج البحث عن: ${query}`;
                
                searchContainer.innerHTML = '';
                results.forEach(movie => {
                    if(!movie.poster_path) return;
                    const card = document.createElement('div');
                    card.classList.add('movie-card');
                    card.innerHTML = `
                        <img src="${POSTER_URL}${movie.poster_path}" alt="${movie.title}">
                        <div class="card-overlay"><h4>${movie.title}</h4></div>
                    `;
                    card.addEventListener('click', () => openNetflixModal(movie));
                    searchContainer.appendChild(card);
                });
            } catch (err) { console.error(err); }
        });

        // تشغيل وإخفاء السبلش سكرين فور تحميل الداتا
        async function init() {
            const trending = await buildNetflixRow('/movie/trending/day', 'row-trending');
            if(trending && trending.length > 0) setupHeroBanner(trending[0]);
            await buildNetflixRow('/discover/movie', 'row-action', '&with_genres=28');
            await buildNetflixRow('/movie/top_rated', 'row-top-rated');
            
            // إخفاء السبلش سكرين فوراً لأن الداتا وصلت والموقع جاهز!
            const splash = document.getElementById('splash-screen');
            splash.style.opacity = '0';
            setTimeout(() => splash.style.visibility = 'hidden', 500);
        }

        init();
    </script>
</body>
</html>
