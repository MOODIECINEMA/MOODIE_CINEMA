<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOODIE | عالم السينما الحقيقي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #d4af37; --black: #050505; --card: #121212; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: var(--black); color: white; overflow-x: hidden; }

        /* الهيدر الملكي */
        header { 
            background: rgba(0,0,0,0.9); height: 70px; display: flex; 
            justify-content: space-between; align-items: center; padding: 0 5%;
            position: fixed; top: 0; width: 100%; z-index: 1000; border-bottom: 1px solid var(--gold);
        }
        .logo { font-size: 28px; font-weight: 900; color: var(--gold); letter-spacing: 2px; }

        /* منطقة البحث */
        .hero { 
            padding: 120px 5% 40px; text-align: center;
            background: linear-gradient(to bottom, #111, var(--black));
        }
        .search-container { 
            max-width: 600px; margin: 20px auto; display: flex; 
            background: #1a1a1a; border-radius: 50px; overflow: hidden; border: 1px solid var(--gold);
        }
        .search-container input { 
            flex: 1; background: transparent; border: none; padding: 15px 20px; 
            color: white; font-size: 16px; outline: none;
        }
        .search-container button { background: var(--gold); border: none; padding: 0 25px; cursor: pointer; color: black; font-weight: bold; }

        /* المشغل */
        #player-section { padding: 20px 5%; display: none; }
        .video-wrapper { 
            max-width: 1000px; margin: 0 auto; background: #000; 
            border-radius: 15px; overflow: hidden; border: 2px solid #333; box-shadow: 0 0 30px rgba(212,175,55,0.2);
        }
        iframe { width: 100%; aspect-ratio: 16/9; border: none; }

        /* شبكة الأفلام */
        .section-title { padding: 30px 5% 10px; font-size: 22px; font-weight: bold; color: var(--gold); border-right: 4px solid var(--gold); margin-right: 5%; }
        .movie-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); 
            gap: 20px; padding: 20px 5%; 
        }
        .movie-card { 
            background: var(--card); border-radius: 10px; overflow: hidden; 
            cursor: pointer; transition: 0.3s; border: 1px solid #222;
        }
        .movie-card:hover { transform: translateY(-10px); border-color: var(--gold); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .movie-card img { width: 100%; height: 225px; object-fit: cover; }
        .movie-card h3 { padding: 10px; font-size: 13px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        footer { padding: 40px; text-align: center; color: #444; font-size: 14px; border-top: 1px solid #111; }
    </style>
</head>
<body>

    <header>
        <div class="logo">MOODIE</div>
        <div style="color: #666; font-size: 12px;">Premium Cinema Experience</div>
    </header>

    <div class="hero">
        <h1>إيه فيلمك المفضل النهاردة؟</h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="اكتب اسم الفيلم بالعربي أو الإنجليزي...">
            <button onclick="search()"><i class="fas fa-search"></i></button>
        </div>
    </div>

    <div id="player-section">
        <div class="video-wrapper">
            <iframe id="mainPlayer" src="" allowfullscreen></iframe>
        </div>
        <h2 id="currentTitle" style="text-align: center; margin-top: 15px; color: var(--gold);"></h2>
    </div>

    <div class="section-title">🔥 أفلام عالمية مختارة لك</div>
    <div class="movie-grid" id="trending-grid"></div>

    <div class="section-title">🇸🇦 حصريات عربية</div>
    <div class="movie-grid" id="arabic-grid"></div>

    <footer>
        <p>© 2026 MOODIE CINEMA | المنصة الأقوى لمشاهدة الأفلام</p>
    </footer>

    <script>
        const API_KEY = '8d398e30ad929d674454995574366914';

        async function loadMovies(url, containerId) {
            try {
                const res = await fetch(url);
                const data = await res.json();
                const container = document.getElementById(containerId);
                container.innerHTML = '';
                
                data.results.forEach(movie => {
                    if(!movie.poster_path) return;
                    const card = document.createElement('div');
                    card.className = 'movie-card';
                    card.onclick = () => playMovie(movie.id, movie.title || movie.name);
                    card.innerHTML = `
                        <img src="https://image.tmdb.org/t/p/w500${movie.poster_path}">
                        <h3>${movie.title || movie.name}</h3>
                    `;
                    container.appendChild(card);
                });
            } catch (e) { console.error("خطأ في التحميل"); }
        }

        function playMovie(id, title) {
            const section = document.getElementById('player-section');
            const player = document.getElementById('mainPlayer');
            section.style.display = 'block';
            // استخدام سيرفر Vidsrc الموثوق للترجمة والجودة
            player.src = `https://vidsrc.xyz/embed/movie/${id}`;
            document.getElementById('currentTitle').innerText = title;
            section.scrollIntoView({ behavior: 'smooth' });
        }

        function search() {
            const q = document.getElementById('searchInput').value;
            if(q) loadMovies(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${q}&language=ar`, 'trending-grid');
        }

        window.onload = () => {
            loadMovies(`https://api.themoviedb.org/3/trending/movie/week?api_key=${API_KEY}&language=ar`, 'trending-grid');
            loadMovies(`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_original_language=ar&language=ar`, 'arabic-grid');
        };
    </script>
</body>
</html>
