<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAFLIX | التجربة العالمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --glass: rgba(255, 255, 255, 0.03); --border: rgba(255, 255, 255, 0.1); --neon: #00d2ff; }
        body { background: radial-gradient(circle at top, #0f172a, #020617); color: white; font-family: 'Segoe UI', sans-serif; min-height: 100vh; overflow-x: hidden; }
        .glass-panel { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 24px; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid var(--border); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .glass-card:hover { transform: translateY(-10px) scale(1.02); border-color: var(--neon); box-shadow: 0 0 30px rgba(0, 210, 255, 0.2); }
        .active-link { background: linear-gradient(90deg, rgba(0, 210, 255, 0.2), transparent); border-right: 4px solid var(--neon); color: var(--neon); }
        #loader { position: fixed; inset: 0; background: #020617; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .search-overlay { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(20px); z-index: 500; display: none; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </script>
</head>
<body onload="initSite()">

    <!-- 1. شاشة التحميل (Netflix Style Intro) -->
    <div id="loader">
        <div class="relative">
            <h1 class="text-7xl font-black tracking-tighter animate-pulse" style="color: var(--neon); text-shadow: 0 0 20px var(--neon);">SHAFLIX</h1>
            <div class="absolute -bottom-4 left-0 h-1 bg-white animate-[loading_2s_ease-in-out_infinite]" id="load-bar"></div>
        </div>
        <p class="mt-8 text-gray-500 tracking-[0.3em] uppercase text-xs">Initializing AI Engine...</p>
    </div>

    <!-- 2. القائمة الجانبية الفخمة -->
    <div class="flex min-h-screen">
        <aside class="w-72 h-screen sticky top-0 p-6 flex flex-col justify-between border-l border-white/5 bg-black/20">
            <div>
                <div class="mb-12 px-4 text-3xl font-bold italic" style="color: var(--neon)">S.</div>
                <nav class="space-y-2">
                    <button onclick="switchPage('home')" class="nav-btn w-full flex items-center gap-4 p-4 rounded-xl transition active-link">
                        <i class="fas fa-home"></i> الرئيسية
                    </button>
                    <button onclick="openSearch()" class="nav-btn w-full flex items-center gap-4 p-4 rounded-xl transition hover:bg-white/5">
                        <i class="fas fa-search"></i> البحث الذكي
                    </button>
                    <button onclick="switchPage('movies')" class="nav-btn w-full flex items-center gap-4 p-4 rounded-xl transition hover:bg-white/5">
                        <i class="fas fa-film"></i> الأفلام
                    </button>
                    <button onclick="switchPage('contact')" class="nav-btn w-full flex items-center gap-4 p-4 rounded-xl transition hover:bg-white/5">
                        <i class="fas fa-envelope"></i> تواصل معنا
                    </button>
                </nav>
            </div>
            <div class="p-4 glass-panel text-[10px] text-gray-500 leading-relaxed">
                <p>جميع الحقوق محفوظة © SHAFLIX</p>
                <p class="mt-2 text-red-400/50 cursor-pointer hover:text-red-400" onclick="switchPage('disclaimer')">إخلاء مسؤولية API</p>
            </div>
        </aside>

        <!-- 3. المحتوى الرئيسي -->
        <main class="flex-1 p-10 relative">
            
            <!-- مشغل الأفلام (فخامة الشاشة الكاملة) -->
            <div id="player-container" class="hidden mb-12">
                <div class="relative glass-panel overflow-hidden aspect-video shadow-2xl border-2 border-cyan-500/20">
                    <button onclick="closePlayer()" class="absolute top-4 right-4 z-10 bg-black/50 p-3 rounded-full hover:bg-red-500 transition">
                        <i class="fas fa-times"></i>
                    </button>
                    <iframe id="main-player" src="" class="w-full h-full" frameborder="0" allowfullscreen></iframe>
                </div>
            </div>

            <!-- الصفحات -->
            <div id="page-content">
                <!-- الصفحة الرئيسية -->
                <section id="home-page">
                    <div class="mb-12 glass-panel p-10 h-80 flex flex-col justify-end relative overflow-hidden group">
                        <div id="hero-bg" class="absolute inset-0 opacity-40 group-hover:scale-110 transition duration-700"></div>
                        <div class="relative z-10">
                            <span class="bg-cyan-500 px-3 py-1 rounded-full text-xs font-bold mb-4 inline-block">الأكثر مشاهدة الآن</span>
                            <h2 id="hero-title" class="text-5xl font-bold mb-4">...</h2>
                            <p id="hero-desc" class="max-w-xl text-gray-300 line-clamp-2 italic">جاري تحميل البيانات الذكية...</p>
                        </div>
                    </div>

                    <h3 class="text-2xl font-bold mb-8 flex items-center gap-3">
                        <span class="w-2 h-8 bg-cyan-500 rounded-full"></span> اكتشف الجديد
                    </h3>
                    <div id="movie-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-5 gap-8">
                        <!-- الكروت هنا -->
                    </div>
                </section>

                <!-- صفحة التواصل -->
                <section id="contact-page" class="hidden max-w-2xl mx-auto py-20 text-center">
                    <div class="glass-panel p-12">
                        <i class="fas fa-paper-plane text-5xl mb-6 text-cyan-400"></i>
                        <h2 class="text-3xl font-bold mb-4">تواصل مع الفريق العالمي</h2>
                        <p class="text-gray-400 mb-8">نحن نستخدم تشفير Proton لضمان خصوصية تواصلك.</p>
                        <a href="mailto:your-email@proton.me" class="block w-full p-4 bg-cyan-600 rounded-xl font-bold hover:bg-cyan-700 transition">
                            ارسل إيميل عبر Proton Mail
                        </a>
                    </div>
                </section>

                <!-- صفحة إخلاء المسؤولية -->
                <section id="disclaimer-page" class="hidden max-w-3xl mx-auto py-20">
                    <div class="glass-panel p-12 leading-loose text-gray-300">
                        <h2 class="text-2xl font-bold text-white mb-6">إخلاء مسؤولية قانوني</h2>
                        <p>نحن في SHAFLIX نعتمد كلياً على تقنية الـ **API** الخارجية لجلب المحتوى الرقمي. الموقع لا يستضيف أي ملفات فيديو على سيرفراته الخاصة. جميع الحقوق تعود لأصحاب العمل الأصليين.</p>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- 4. واجهة البحث المنفصلة (Netflix Search Style) -->
    <div id="search-overlay" class="search-overlay">
        <div class="p-20">
            <div class="flex justify-between items-center mb-12">
                <input id="searchQuery" type="text" placeholder="ماذا تريد أن تشاهد اليوم؟" 
                       class="bg-transparent border-b-4 border-cyan-500 text-4xl w-full outline-none pb-4 font-bold">
                <button onclick="closeSearch()" class="text-4xl hover:text-red-500 p-4"><i class="fas fa-times"></i></button>
            </div>
            <div id="search-results" class="grid grid-cols-2 md:grid-cols-5 gap-8"></div>
        </div>
    </div>

    <script>
        const CONFIG = {
            API_KEY: 'da87358fe15e91315b13c0b1f439b8fd',
            BASE_URL: 'https://api.themoviedb.org/3',
            IMG_URL: 'https://image.tmdb.org/t/p/w500',
            PLAYER_URL: 'https://vidsrc.me/embed/movie?tmdb='
        };

        async function initSite() {
            await loadMovies();
            // نظام التحديث التلقائي كل ساعة
            setInterval(loadMovies, 3600000);
            setTimeout(() => {
                document.getElementById('loader').classList.add('opacity-0');
                setTimeout(() => document.getElementById('loader').style.display = 'none', 500);
            }, 2000);
        }

        async function loadMovies() {
            const res = await fetch(`${CONFIG.BASE_URL}/movie/popular?api_key=${CONFIG.API_KEY}&language=ar-SA`);
            const data = await res.json();
            renderGrid(data.results, 'movie-grid');
            setupHero(data.results[0]);
        }

        function setupHero(movie) {
            document.getElementById('hero-title').innerText = movie.title;
            document.getElementById('hero-desc').innerText = movie.overview;
            document.getElementById('hero-bg').style.background = `url('https://image.tmdb.org/t/p/original${movie.backdrop_path}') center/cover`;
        }

        function renderGrid(movies, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = movies.map(m => `
                <div class="glass-card rounded-2xl overflow-hidden cursor-pointer group" onclick="playMovie(${m.id})">
                    <div class="relative">
                        <img src="${CONFIG.IMG_URL}${m.poster_path}" alt="${m.title}" class="w-full h-72 object-cover">
                        <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 flex items-center justify-center transition">
                            <i class="fas fa-play-circle text-5xl text-cyan-400"></i>
                        </div>
                    </div>
                    <div class="p-4">
                        <h4 class="font-bold truncate text-sm">${m.title}</h4>
                        <div class="flex justify-between items-center mt-3 text-[10px] text-gray-400">
                            <span><i class="fas fa-star text-yellow-500"></i> ${m.vote_average}</span>
                            <span class="border border-white/20 px-2 py-0.5 rounded">HD</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function playMovie(id) {
            document.getElementById('player-container').classList.remove('hidden');
            document.getElementById('main-player').src = CONFIG.PLAYER_URL + id;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closePlayer() {
            document.getElementById('player-container').classList.add('hidden');
            document.getElementById('main-player').src = "";
        }

        function switchPage(pageId) {
            const sections = ['home-page', 'contact-page', 'disclaimer-page'];
            sections.forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(`${pageId}-page`).classList.remove('hidden');
            
            // تحديث شكل القائمة الجانبية
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-link'));
            event.currentTarget.classList.add('active-link');
        }

        // نظام البحث
        function openSearch() { document.getElementById('search-overlay').style.display = 'block'; }
        function closeSearch() { document.getElementById('search-overlay').style.display = 'none'; }

        document.getElementById('searchQuery').addEventListener('input', async (e) => {
            const q = e.target.value;
            if(q.length > 2) {
                const res = await fetch(`${CONFIG.BASE_URL}/search/movie?api_key=${CONFIG.API_KEY}&query=${q}&language=ar-SA`);
                const data = await res.json();
                renderGrid(data.results, 'search-results');
            }
        });
    </script>
</body>
</html>
