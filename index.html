<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAFLIX - Premium Streaming Experience</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'deep-space': '#0a0e1a',
                        'deep-space-light': '#111827',
                        'neon-cyan': '#00f0ff',
                        'neon-cyan-dim': '#00b8c4',
                        'netflix-red': '#e50914',
                        'netflix-red-dark': '#b20710',
                        'glass-bg': 'rgba(17, 24, 39, 0.7)',
                        'glass-border': 'rgba(255, 255, 255, 0.1)',
                    },
                    fontFamily: {
                        'inter': ['Inter', 'sans-serif'],
                        'bebas': ['Bebas Neue', 'sans-serif'],
                    },
                    backdropBlur: {
                        'xs': '2px',
                    }
                }
            }
        }
    </script>

    <style>
        /* ============================================
           SHAFLIX - CINEMATIC STREAMING PLATFORM
           Glassmorphism + Neon Aesthetic
           ============================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e1a;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* --- Animated Background Gradient --- */
        .bg-gradient-animated {
            background: linear-gradient(135deg, #0a0e1a 0%, #0f172a 25%, #1e1b4b 50%, #0f172a 75%, #0a0e1a 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- Glassmorphism Base Classes --- */
        .glass {
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-strong {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.15), 0 8px 32px rgba(0, 0, 0, 0.4);
            transform: scale(1.05) translateY(-8px);
        }

        /* --- Neon Glow Effects --- */
        .neon-text {
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5), 0 0 20px rgba(0, 240, 255, 0.3);
        }

        .neon-border {
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2), inset 0 0 15px rgba(0, 240, 255, 0.05);
        }

        .glow-cyan {
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
        }

        .glow-red {
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.4);
        }

        /* --- Loading Screen --- */
        #loading-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #0a0e1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 4rem;
            letter-spacing: 0.2em;
            background: linear-gradient(90deg, #00f0ff, #e50914, #00f0ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 2s linear infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% center; }
            100% { background-position: -200% center; }
        }

        .loader-bar {
            width: 200px;
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            margin-top: 2rem;
            overflow: hidden;
            position: relative;
        }

        .loader-bar::after {
            content: '';
            position: absolute;
            left: -50%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, #00f0ff, #e50914);
            border-radius: 3px;
            animation: loadSlide 1.5s ease-in-out infinite;
        }

        @keyframes loadSlide {
            0% { left: -50%; }
            100% { left: 100%; }
        }

        /* --- Sidebar Navigation --- */
        .sidebar {
            width: 80px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 100;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .sidebar:hover {
            width: 240px;
        }

        .sidebar:hover .nav-text {
            opacity: 1;
            transform: translateX(0);
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 1rem 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
            white-space: nowrap;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(0, 240, 255, 0.08);
            border-left-color: #00f0ff;
        }

        .nav-item.active {
            color: #00f0ff;
        }

        .nav-icon {
            min-width: 24px;
            text-align: center;
            font-size: 1.2rem;
        }

        .nav-text {
            margin-left: 1rem;
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.3s ease;
            font-weight: 500;
            font-size: 0.95rem;
        }

        /* --- Main Content Area --- */
        .main-content {
            margin-left: 80px;
            min-height: 100vh;
            transition: margin-left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar:hover ~ .main-content {
            margin-left: 240px;
        }

        /* --- Hero Section --- */
        .hero-section {
            position: relative;
            height: 85vh;
            min-height: 600px;
            overflow: hidden;
        }

        .hero-backdrop {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center top;
            filter: brightness(0.4);
            transform: scale(1.1);
            transition: transform 10s ease;
        }

        .hero-section:hover .hero-backdrop {
            transform: scale(1.15);
        }

        .hero-vignette {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, #0a0e1a 0%, transparent 50%, rgba(10,14,26,0.4) 100%);
        }

        .hero-content {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 4rem;
            padding-bottom: 6rem;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 1rem;
            background: rgba(229, 9, 20, 0.2);
            border: 1px solid rgba(229, 9, 20, 0.4);
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #e50914;
            margin-bottom: 1.5rem;
            width: fit-content;
        }

        .hero-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(3rem, 8vw, 6rem);
            line-height: 1;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
            background: linear-gradient(180deg, #ffffff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-meta {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            color: rgba(255,255,255,0.7);
        }

        .hero-rating {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            color: #fbbf24;
        }

        .hero-overview {
            max-width: 600px;
            font-size: 1.05rem;
            line-height: 1.7;
            color: rgba(255,255,255,0.8);
            margin-bottom: 2rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .hero-buttons {
            display: flex;
            gap: 1rem;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.9rem 2rem;
            background: linear-gradient(135deg, #e50914, #b20710);
            color: white;
            font-weight: 600;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(229, 9, 20, 0.4);
        }

        .btn-glass {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.9rem 2rem;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            color: white;
            font-weight: 600;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .btn-glass:hover {
            background: rgba(255,255,255,0.2);
            border-color: rgba(0, 240, 255, 0.4);
        }

        /* --- Movie Grid & Cards --- */
        .section-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2rem;
            letter-spacing: 0.1em;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(0,240,255,0.5), transparent);
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .movie-card {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            aspect-ratio: 2/3;
        }

        .movie-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .movie-card:hover img {
            transform: scale(1.1);
        }

        .movie-card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(10,14,26,0.95) 0%, rgba(10,14,26,0.3) 40%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 1rem;
        }

        .movie-card:hover .movie-card-overlay {
            opacity: 1;
        }

        .movie-card-title {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .movie-card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
        }

        .movie-card-rating {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            color: #fbbf24;
        }

        .hd-badge {
            padding: 0.15rem 0.5rem;
            background: rgba(0, 240, 255, 0.2);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 3px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #00f0ff;
            text-transform: uppercase;
        }

        .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 60px;
            height: 60px;
            background: rgba(0, 240, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(0, 240, 255, 0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.4s ease;
        }

        .play-icon i {
            color: #00f0ff;
            font-size: 1.5rem;
            margin-left: 4px;
        }

        .movie-card:hover .play-icon {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* --- Search Section --- */
        .search-container {
            position: relative;
            max-width: 600px;
            margin: 0 auto 3rem;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1.5rem 1rem 3rem;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: rgba(0, 240, 255, 0.5);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
            background: rgba(255,255,255,0.08);
        }

        .search-input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .search-icon {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.4);
            font-size: 1.1rem;
        }

        /* --- Video Player Modal --- */
        .player-modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .player-modal.active {
            display: flex;
        }

        .player-container {
            width: 100%;
            max-width: 1200px;
            aspect-ratio: 16/9;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.1);
        }

        .player-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-close {
            position: absolute;
            top: -50px;
            right: 0;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 1.2rem;
        }

        .player-close:hover {
            background: rgba(229, 9, 20, 0.3);
            border-color: rgba(229, 9, 20, 0.5);
            transform: rotate(90deg);
        }

        .player-title {
            position: absolute;
            top: -50px;
            left: 0;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 0.1em;
            color: rgba(255,255,255,0.8);
        }

        /* --- Contact & Disclaimer Pages --- */
        .page-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .page-card {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 2.5rem;
            margin-bottom: 2rem;
        }

        .page-card h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 0.1em;
            margin-bottom: 1.5rem;
            color: #00f0ff;
        }

        .page-card p {
            line-height: 1.8;
            color: rgba(255,255,255,0.7);
            margin-bottom: 1rem;
        }

        .contact-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #6d28d9, #4c1d95);
            color: white;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .contact-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(109, 40, 217, 0.4);
        }

        /* --- Scrollbar Styling --- */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0e1a;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 240, 255, 0.3);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 240, 255, 0.5);
        }

        /* --- Responsive --- */
        @media (max-width: 768px) {
            .sidebar {
                width: 60px;
            }
            .sidebar:hover {
                width: 200px;
            }
            .main-content {
                margin-left: 60px;
            }
            .sidebar:hover ~ .main-content {
                margin-left: 200px;
            }
            .hero-content {
                padding: 2rem;
                padding-bottom: 4rem;
            }
            .movie-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 1rem;
            }
            .player-modal {
                padding: 1rem;
            }
