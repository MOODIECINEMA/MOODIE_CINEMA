<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoltFlix - مشاهدة أفلام ومسلسلات أونلاين</title>
  <meta name="description" content="VoltFlix - منصة مشاهدة الأفلام والمسلسلات أونلاين مجاناً بجودة عالية">
  <meta name="keywords" content="أفلام, مسلسلات, مشاهدة اونلاين, VoltFlix">
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="VoltFlix - مشاهدة أفلام ومسلسلات أونلاين">
  <meta property="og:image" content="https://img.icons8.com/fluent/512/000000/movie-projector.png">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;rect width='100' height='100' rx='18' fill='%23e50914'/&gt;&lt;text y='.9em' font-size='75' x='10' fill='white' font-weight='900'&gt;V&lt;/text&gt;&lt;/svg&gt;">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--red:#e50914;--bg:#0a0a0a;--card:#141414;--modal:#181818;--g:#b3b3b3;--gold:#f5c518}
    body{font-family:'Cairo',sans-serif;background:var(--bg);color:#fff;direction:rtl;overflow-x:hidden}
    #splash{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .8s}
    #splash.hidden{opacity:0;visibility:hidden}
    .slogo{font-size:3rem;font-weight:900;animation:pulse 1s infinite}
    .slogo span{color:var(--red)}
    .sbar{width:180px;height:3px;background:#333;margin-top:20px}
    .sprog{height:100%;background:var(--red);width:0;animation:load 2s forwards}
    @keyframes pulse{0%{opacity:.6}100%{opacity:1}}
    @keyframes load{0%{width:0}100%{width:100%}}
    #hdr{position:fixed;top:0;left:0;right:0;padding:0 5%;height:64px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,rgba(0,0,0,.95),transparent);z-index:100}
    .logo{font-size:1.8rem;font-weight:900;cursor:pointer;display:flex;align-items:center;gap:8px}
    .lico{width:34px;height:34px;background:var(--red);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900}
    .logo span{color:var(--red)}
    .nav{display:flex;gap:20px}
    .nav a{color:var(--g);cursor:pointer;transition:color .3s}
    .nav a:hover{color:#fff}
    .acts{display:flex;gap:10px}
    .sw{display:flex;background:rgba(0,0,0,.7);border:1px solid #333;border-radius:4px}
    .sw input{padding:8px;background:transparent;border:none;color:#fff;font-family:inherit;outline:none;width:180px}
    .sw button{padding:8px;background:transparent;color:var(--g);cursor:pointer}
    .wlbtn{position:relative;background:transparent;color:var(--g);padding:8px;border-radius:50%;cursor:pointer;border:none}
    .wlc{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:10px;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center}
    #hero{position:relative;height:80vh;display:flex;align-items:flex-end;padding:0 5% 5%;overflow:hidden}
    .hbg{position:absolute;inset:0;background-size:cover;background-position:center}
    .hov{position:absolute;inset:0;background:linear-gradient(to top,var(--bg),transparent)}
    .hcon{position:relative;z-index:2;max-width:500px}
    .hbadge{display:inline-block;background:var(--red);padding:4px 12px;border-radius:4px;font-size:12px;margin-bottom:12px}
    .htitle{font-size:2.5rem;font-weight:900;margin-bottom:12px}
    .hdesc{color:var(--g);margin-bottom:18px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .hacts{display:flex;gap:12px}
    .bp{background:var(--red);color:#fff;border:none;padding:10px 24px;border-radius:6px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px}
    .bs{background:rgba(255,255,255,.2);color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:8px}
    #main{padding:0 5% 40px}
    .sec{margin-bottom:40px}
    .sech{margin-bottom:15px}
    .sect{font-size:1.2rem;display:flex;align-items:center;gap:8px}
    .row{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px}
    .row::-webkit-scrollbar{height:4px}
    .row::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
    .card{flex-shrink:0;width:155px;cursor:pointer;transition:transform .3s}
    .card:hover{transform:scale(1.05)}
    .cposter{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:8px}
    .sk{flex-shrink:0;width:155px;aspect-ratio:2/3;background:#1a1a1a;border-radius:8px;animation:pulse 1.5s infinite}
    #mover{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
    #mover.open{display:flex}
    #mod{background:var(--modal);border-radius:12px;max-width:800px;width:100%;max-height:90vh;overflow-y:auto}
    .mcls{float:left;background:#333;color:#fff;border:none;width:35px;height:35px;border-radius:50%;margin:10px;cursor:pointer}
    .mbk{width:100%;height:200px;object-fit:cover;border-radius:12px 12px 0 0}
    .mbody{padding:20px}
    .mtit{font-size:1.5rem;margin-bottom:10px}
    .mmeta{display:flex;gap:15px;margin-bottom:15px;color:var(--g)}
    .mdesc{color:var(--g);line-height:1.6;margin-bottom:20px}
    .plcon{position:relative;width:100%;height:400px;background:#000;border-radius:8px;margin-top:20px}
    .plcon iframe{width:100%;height:100%;border:none}
    .wm{position:absolute;bottom:10px;left:10px;opacity:.7;pointer-events:none;width:100px}
    .plload{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#fff;flex-direction:column;gap:10px}
    .plload.hid{display:none}
    .spin{width:40px;height:40px;border:3px solid #333;border-top-color:var(--red);border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    #wlp{position:fixed;top:64px;left:0;right:0;bottom:0;background:var(--bg);z-index:150;display:none;overflow-y:auto;padding:30px 5%}
    #wlp.open{display:block}
    .wlgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:15px}
    #smp{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:300;display:none;padding:30px}
    #smp.open{display:block}
    .smcon{background:var(--modal);border-radius:12px;padding:25px;max-width:700px;margin:0 auto}
    #smurls{background:#000;padding:15px;border-radius:8px;font-family:monospace;font-size:12px;color:#4ade80;max-height:300px;overflow-y:auto;margin:15px 0}
    #toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:8px;z-index:400;opacity:0;transition:opacity .3s;pointer-events:none}
    #toast.show{opacity:1}
    #ftr{background:var(--card);text-align:center;padding:30px;border-top:1px solid #222}
    .flogo{font-size:1.5rem;font-weight:900;margin-bottom:10px}
    .flinks{display:flex;justify-content:center;gap:20px;margin:15px 0}
    .flinks a{color:var(--g);cursor:pointer}
    @media(max-width:768px){.nav{display:none}.card{width:120px}.sk{width:120px}.plcon{height:250px}}
  </style>
</head>
<body>

<div id="splash"><div class="slogo">Volt<span>Flix</span></div><div class="sbar"><div class="sprog"></div></div></div>
<div id="toast"></div>

<header id="hdr">
  <div class="logo" onclick="scrollToTop()"><div class="lico">V</div>Volt<span>Flix</span></div>
  <nav class="nav"><a onclick="scrollToTop()">الرئيسية</a><a onclick="openWL()">قائمتي</a><a onclick="openSM()">خريطة الموقع</a></nav>
  <div class="acts">
    <div class="sw"><input id="sinp" placeholder="ابحث عن فيلم..." type="text"><button onclick="doSearch()"><i class="fas fa-search"></i></button></div>
    <button class="wlbtn" onclick="openWL()"><i class="fas fa-bookmark"></i><span class="wlc" id="wlc">0</span></button>
  </div>
</header>
<div id="sres"></div>

<section id="hero">
  <div class="hbg" id="hbg"></div>
  <div class="hov"></div>
  <div class="hcon">
    <div class="hbadge"><i class="fas fa-fire"></i> الأكثر مشاهدة</div>
    <h1 class="htitle" id="htit">جارٍ التحميل...</h1>
    <p class="hdesc" id="hdesc"></p>
    <div class="hacts"><button class="bp" onclick="heroPlay()"><i class="fas fa-play"></i> شاهد الآن</button><button class="bs" onclick="heroInfo()"><i class="fas fa-info-circle"></i> مزيد</button></div>
  </div>
</section>

<main id="main">
  <div class="sec"><div class="sech"><h2 class="sect"><i class="fas fa-fire" style="color:var(--red)"></i> الأكثر رواجاً</h2></div><div class="row" id="r-trend"></div></div>
  <div class="sec"><div class="sech"><h2 class="sect"><i class="fas fa-star" style="color:var(--gold)"></i> الأعلى تقييماً</h2></div><div class="row" id="r-top"></div></div>
  <div class="sec"><div class="sech"><h2 class="sect"><i class="fas fa-bolt"></i> أفلام الأكشن</h2></div><div class="row" id="r-act"></div></div>
  <div class="sec"><div class="sech"><h2 class="sect"><i class="fas fa-laugh"></i> الكوميديا</h2></div><div class="row" id="r-com"></div></div>
  <div class="sec"><div class="sech"><h2 class="sect"><i class="fas fa-tv"></i> مسلسلات شائعة</h2></div><div class="row" id="r-tv"></div></div>
</main>

<div id="mover" onclick="closeMod(event)"><div id="mod"><button class="mcls" onclick="closeMod()"><i class="fas fa-times"></i></button><img class="mbk" id="mbk" alt=""><div class="mbody"><h2 class="mtit" id="mtit"></h2><div class="mmeta" id="mmeta"></div><p class="mdesc" id="mdesc"></p><div class="macts"><button class="bp" onclick="startPlay()"><i class="fas fa-play"></i> تشغيل</button><button class="bs" id="wlbtn2" onclick="toggleWL()"><i class="far fa-bookmark"></i> حفظ</button></div><div id="pls"><div class="plcon"><div class="plload" id="plload"><div class="spin"></div><p>جار التحميل...</p></div><iframe id="pliframe" allowfullscreen="true" allow="autoplay; fullscreen; encrypted-media; picture-in-picture"></iframe><div class="wm"><svg viewBox="0 0 100 30" width="80"><rect width="25" height="25" rx="5" fill="#e50914" y="3"></rect><text x="6" y="21" fill="#fff" font-size="18" font-weight="900">V</text><text x="30" y="21" fill="#fff" font-size="14">VoltFlix</text></svg></div></div><p class="plnote">غير المصدر لو مانع الإعلانات شغال</p></div></div></div></div></div>

<div id="wlp"><div style="display:flex;justify-content:space-between;margin-bottom:20px"><h2><i class="fas fa-bookmark"></i> قائمتي</h2><button class="bs" onclick="closeWL()">رجوع</button></div><div class="wlgrid" id="wlgrid"></div></div>

<div id="smp"><div class="smcon"><div style="display:flex;justify-content:space-between"><h2><i class="fas fa-sitemap"></i> خريطة الموقع</h2><button class="bs" onclick="closeSM()">إغلاق</button></div><div id="smurls"></div><button class="bp" onclick="copySM()"><i class="fas fa-copy"></i> نسخ الروابط</button></div></div>

<footer id="ftr"><div class="flogo">Volt<span>Flix</span></div><div class="flinks"><a onclick="scrollToTop()">الرئيسية</a><a onclick="openWL()">قائمتي</a><a onclick="openSM()">خريطة الموقع</a></div><p>© 2025 VoltFlix - بيانات من TMDB</p></footer>

<script>
// VoltFlix - نسخة متوافقة مع كل المتصفحات
(function(){
  const CFG = {
    KEY: 'da87358fe15e91315b13c0b1f439b8fd',
    BASE: 'https://api.themoviedb.org/3',
    IMG: 'https://image.tmdb.org/t/p/w300',
    SRC1: function(id, tv){ return tv ? 'https://vidsrc.me/embed/tv?tmdb=' + id + '&season=1&episode=1' : 'https://vidsrc.me/embed/movie?tmdb=' + id; },
    SRC2: function(id, tv){ return tv ? 'https://vidsrc.cc/v2/embed/tv/' + id + '/1/1' : 'https://vidsrc.cc/v2/embed/movie/' + id; },
    SRC3: function(id, tv){ return tv ? 'https://www.2embed.cc/embedtv/' + id + '&s=1&e=1' : 'https://www.2embed.cc/embed/' + id; }
  };

  let state = {
    movie: null,
    isTV: false,
    srcIndex: 0,
    wl: [],
    allMovies: [],
    hero: null
  };

  try { state.wl = JSON.parse(localStorage.getItem('vf_wl') || '[]'); } catch(e) { state.wl = []; }

  function showToast(msg){
    let t = document.getElementById('toast');
    t.innerText = msg;
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 2500);
  }

  function api(endpoint, params){
    let url = CFG.BASE + endpoint + '?api_key=' + CFG.KEY + '&language=ar';
    if(params){
      for(let k in params){
        url += '&' + k + '=' + encodeURIComponent(params[k]);
      }
    }
    return fetch(url).then(function(r){ return r.json(); }).catch(function(){ return null; });
  }

  function makeCard(m, isTV){
    let id = m.id;
    let title = (m.title || m.name || '').replace(/'/g, "&#39;");
    let poster = m.poster_path ? CFG.IMG + m.poster_path : 'https://via.placeholder.com/300x450?text=No+Image';
    return '<div class="card" onclick="openModal(' + id + ',' + isTV + ')"><img class="cposter" src="' + poster + '" alt="' + title + '" loading="lazy"></div>';
  }

  function loadSection(endpoint, rowId, isHero){
    let el = document.getElementById(rowId);
    if(!el) return;
    el.innerHTML = '<div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>';
    api(endpoint, {}).then(function(data){
      if(!data || !data.results){
        el.innerHTML = '<p style="color:#666;padding:20px">خطأ في التحميل</p>';
        return;
      }
      let items = data.results.slice(0,12);
      for(let i=0; i<items.length; i++){
        let exists = false;
        for(let j=0; j<state.allMovies.length; j++){
          if(state.allMovies[j].id === items[i].id){ exists = true; break; }
        }
        if(!exists) state.allMovies.push(items[i]);
      }
      let html = '';
      for(let i=0; i<items.length; i++) html += makeCard(items[i], false);
      el.innerHTML = html;
      if(isHero && items[0]) setHero(items[0]);
    });
  }

  function loadTV(){
    api('/tv/popular', {}).then(function(data){
      if(data && data.results){
        let el = document.getElementById('r-tv');
        let html = '';
        for(let i=0; i<data.results.slice(0,12).length; i++){
          html += makeCard(data.results[i], true);
        }
        el.innerHTML = html;
      }
    });
  }

  function setHero(m){
    let bg = m.backdrop_path ? 'https://image.tmdb.org/t/p/original' + m.backdrop_path : '';
    document.getElementById('hbg').style.backgroundImage = 'url(' + bg + ')';
    document.getElementById('htit').innerText = m.title || m.name || '';
    document.getElementById('hdesc').innerText = (m.overview || '').slice(0,150);
    state.hero = m;
  }

  window.heroPlay = function(){ if(state.hero) openModal(state.hero.id, false, true); };
  window.heroInfo = function(){ if(state.hero) openModal(state.hero.id, false, false); };

  window.openModal = function(id, isTV, autoPlay){
    state.isTV = isTV;
    state.srcIndex = 0;
    document.getElementById('mover').classList.add('open');
    document.body.style.overflow = 'hidden';
    let ep = isTV ? '/tv/' + id : '/movie/' + id;
    api(ep, {}).then(function(data){
      if(!data) return;
      state.movie = data;
      let bg = data.backdrop_path ? 'https://image.tmdb.org/t/p/w1280' + data.backdrop_path : '';
      document.getElementById('mbk').src = bg;
      document.getElementById('mtit').innerText = data.title || data.name || '';
      document.getElementById('mdesc').innerHTML = data.overview || 'لا يوجد وصف';
      let year = (data.release_date || data.first_air_date || '').slice(0,4);
      let rating = (data.vote_average || 0).toFixed(1);
      document.getElementById('mmeta').innerHTML = '<span><i class="fas fa-star" style="color:var(--gold)"></i> ' + rating + '</span><span><i class="fas fa-calendar"></i> ' + (year || 'غير محدد') + '</span>';
      let inWL = false;
      for(let i=0; i<state.wl.length; i++){ if(state.wl[i].id === id){ inWL = true; break; } }
      document.getElementById('wlbtn2').innerHTML = inWL ? '<i class="fas fa-check"></i> في القائمة' : '<i class="far fa-bookmark"></i> حفظ';
      if(autoPlay) startPlay();
    });
  };

  window.closeMod = function(e){
    if(e && e.target !== document.getElementById('mover')) return;
    document.getElementById('mover').classList.remove('open');
    document.body.style.overflow = '';
    document.getElementById('pliframe').src = '';
    document.getElementById('pls').style.display = 'none';
  };

  function startPlay(){
    if(!state.movie) return;
    document.getElementById('pls').style.display = 'block';
    loadSource(0);
  }
  window.startPlay = startPlay;

  function loadSource(idx){
    state.srcIndex = idx;
    let src;
    if(idx === 0) src = CFG.SRC1(state.movie.id, state.isTV);
    else if(idx === 1) src = CFG.SRC2(state.movie.id, state.isTV);
    else src = CFG.SRC3(state.movie.id, state.isTV);
    let loader = document.getElementById('plload');
    let ifr = document.getElementById('pliframe');
    loader.classList.remove('hid');
    ifr.src = '';
    setTimeout(function(){
      ifr.src = src;
      ifr.onload = function(){ loader.classList.add('hid'); };
      setTimeout(function(){
        if(!loader.classList.contains('hid')){
          if(idx < 2) loadSource(idx + 1);
          else { loader.classList.add('hid'); showToast('جرب تغيير المصدر'); }
        }
      }, 10000);
    }, 300);
  }
  window.loadSource = loadSource;
  window.swSrc = loadSource;

  window.toggleWL = function(){
    if(!state.movie) return;
    let exists = false;
    let idx = -1;
    for(let i=0; i<state.wl.length; i++){
      if(state.wl[i].id === state.movie.id){ exists = true; idx = i; break; }
    }
    if(exists){
      state.wl.splice(idx,1);
      showToast('تم الحذف من القائمة');
    } else {
      state.wl.push({id: state.movie.id, title: state.movie.title || state.movie.name, poster: state.movie.poster_path, isTV: state.isTV});
      showToast('تمت الإضافة');
    }
    localStorage.setItem('vf_wl', JSON.stringify(state.wl));
    updateWLCounter();
    let btn = document.getElementById('wlbtn2');
    if(btn) btn.innerHTML = exists ? '<i class="far fa-bookmark"></i> حفظ' : '<i class="fas fa-check"></i> في القائمة';
  };

  function updateWLCounter(){
    document.getElementById('wlc').innerText = state.wl.length;
    document.getElementById('wlc').style.display = state.wl.length ? 'flex' : 'none';
  }

  window.openWL = function(){
    document.getElementById('wlp').classList.add('open');
    let grid = document.getElementById('wlgrid');
    if(state.wl.length === 0){
      grid.innerHTML = '<div style="text-align:center;color:#666;padding:50px">القائمة فارغة</div>';
    } else {
      let html = '';
      for(let i=0; i<state.wl.length; i++){
        let w = state.wl[i];
        let poster = w.poster ? CFG.IMG + w.poster : 'https://via.placeholder.com/300x450';
        html += '<div class="card" onclick="openModal(' + w.id + ',' + w.isTV + ')"><img class="cposter" src="' + poster + '" loading="lazy"></div>';
      }
      grid.innerHTML = html;
    }
  };

  window.closeWL = function(){ document.getElementById('wlp').classList.remove('open'); };
  
  window.openSM = function(){
    document.getElementById('smp').classList.add('open');
    let urls = '# VoltFlix Sitemap\n';
    for(let i=0; i<Math.min(state.allMovies.length,50); i++){
      urls += 'https://voltflix.blogspot.com/#/movie/' + state.allMovies[i].id + '\n';
    }
    document.getElementById('smurls').innerText = urls;
  };
  
  window.closeSM = function(){ document.getElementById('smp').classList.remove('open'); };
  
  window.copySM = function(){
    let t = document.getElementById('smurls').innerText;
    navigator.clipboard.writeText(t);
    showToast('تم النسخ');
  };

  window.doSearch = function(){
    let q = document.getElementById('sinp').value.trim();
    if(!q) return;
    setTimeout(function(){
      api('/search/multi', {query: q}).then(function(data){
        if(data && data.results){
          let resDiv = document.getElementById('sres');
          let html = '';
          for(let i=0; i<data.results.length && i<6; i++){
            let r = data.results[i];
            if(r.media_type !== 'person'){
              html += '<div style="padding:10px;border-bottom:1px solid #222;cursor:pointer" onclick="openModal(' + r.id + ',' + (r.media_type==='tv') + ');document.getElementById(\'sres\').style.display=\'none\'"><b>' + (r.title || r.name) + '</b><span style="color:#666;margin-right:10px">' + (r.media_type==='tv' ? 'مسلسل' : 'فيلم') + '</span></div>';
            }
          }
          resDiv.innerHTML = html;
          resDiv.style.display = 'block';
          function clickHandler(e){
            if(!resDiv.contains(e.target) && !e.target.closest('.sw')){
              resDiv.style.display = 'none';
              document.removeEventListener('click', clickHandler);
            }
          }
          setTimeout(function(){ document.addEventListener('click', clickHandler); }, 100);
        }
      });
    }, 500);
  };

  window.scrollToTop = function(){ window.scrollTo({top: 0, behavior: 'smooth'}); };

  // بدء التحميل
  updateWLCounter();
  loadSection('/trending/movie/week', 'r-trend', true);
  loadSection('/movie/top_rated', 'r-top', false);
  loadSection('/discover/movie?with_genres=28', 'r-act', false);
  loadSection('/discover/movie?with_genres=35', 'r-com', false);
  loadTV();
  
  setTimeout(function(){ document.getElementById('splash').classList.add('hidden'); }, 2000);
  
  window.addEventListener('scroll', function(){
    let hdr = document.getElementById('hdr');
    hdr.style.background = window.scrollY > 50 ? '#0a0a0a' : 'linear-gradient(to bottom,rgba(0,0,0,.95),transparent)';
  });
})();
</script>
