<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>MOODIE | Cinema</title>
    <style>
        body { background: #000; color: gold; text-align: center; font-family: sans-serif; padding-top: 50px; }
        iframe { width: 90%; aspect-ratio: 16/9; border: 2px solid gold; border-radius: 15px; }
        input { padding: 10px; width: 300px; border-radius: 5px; border: none; }
        button { padding: 10px 20px; background: gold; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h1>MOODIE CINEMA</h1>
    <p>ادخل اسم الفيلم أو الـ ID واضغط تشغيل</p>
    <input type="text" id="mId" placeholder="مثال: tt15239678">
    <button onclick="play()">تشغيل</button>
    <br><br>
    <iframe id="player" src="https://vidsrc.to/embed/movie/tt15239678"></iframe>
    <script>
        function play() {
            var id = document.getElementById('mId').value;
            if(id) document.getElementById('player').src = "https://vidsrc.to/embed/movie/" + id;
        }
    </script>
</body>
</html>
