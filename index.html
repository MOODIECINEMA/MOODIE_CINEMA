<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOODIE | السينما العالمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #ffc107; --bg: #050505; --card: #121212; --kids: #00e5ff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; scroll-behavior: smooth; }
        body { background: var(--bg); color: white; overflow-x: hidden; }

        /* Header Premium */
        header { 
            position: fixed; top: 0; width: 100%; height: 70px; 
            background: rgba(0,0,0,0.9); backdrop-filter: blur(15px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 5%; z-index: 2000; border-bottom: 1px solid rgba(255,193,7,0.2);
        }
        .logo { font-size: 30px; font-weight: 900; color: var(--gold); text-shadow: 0 0 15px var(--gold); }
        .nav-links button { background: transparent; color: white; border: 1px solid var(--gold); padding: 8px 15px; border-radius: 5px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .nav-links button:hover { background: var(--gold); color: black; }

        /* Hero Section (3D Look) */
        .hero { 
            height: 70vh; background: linear-gradient(to bottom, transparent, var(--bg)), url('https://w0.peakpx.com/wallpaper/403/551/HD-wallpaper-interstellar-movie-poster-black-hole.jpg');
            background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
        .search-area { width: 90%; max-width: 650px; display: flex; background: rgba(255,255,255,0.05); border: 1px solid var(--gold); border-radius: 50px; overflow: hidden; box-shadow: 0 0 30px rgba(255,193,7,0.1); }
        .search-area input { flex: 1; background: transparent; border: none; padding: 18px 25px; color: white; font-size: 18px; outline: none; }
        .search-area button { background: var(--gold); border: none; width: 80px; cursor: pointer; color: black; font-size: 20px; }

        /* Cinema Player */
        #player-box { display: none; padding: 100px 5% 40px; text-align: center; }
        .frame-wrapper { max-width: 1100px; margin: 0 auto; border: 3px solid var(--gold); border-radius: 20px; overflow: hidden; box-shadow: 0 0 50px rgba(255,193,7,0.3); }
        iframe { width: 100%; aspect-ratio: 16/9; border: none; }

        /* Grid Styling */
        .container { padding: 40px 5%; }
        .title { font-size: 26px; color: var(--gold); margin-bottom: 30px; border-right: 6px solid var(--gold); padding-right: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 25px; }
        .card { background: var(--card); border-radius: 15px; overflow: hidden; cursor: pointer; transition: 0.4s ease; border: 1px solid #222; position: relative; }
        .card:hover { transform: scale(1.08) translateY(-10px); border-color: var(--gold); z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .card img { width: 100%; height: 260px; object-fit: cover; }
        .card .rating { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); color: var(--gold); padding: 3px 8px; border-radius: 5px; font-weight: bold; font-size: 12px; border: 1px solid var(--gold); }
        .card h3 { padding: 12px; font-size: 14px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Kids Mode Overlay */
        #kids-section { display: none; position: fixed; inset: 0; background: #000b1d; z-index: 3000; padding: 5% ; overflow-y: auto; }

        footer { padding: 60px; text-align: center; border-top: 1px solid #111; color: #444; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">MOODIE</div>
        <div class="nav-links">
            <button onclick="toggleKids(true)" style="border-color: var(--kids); color: var(--kids);"><i class="fas fa-child"></i> Kids Mode</button>
        </div>
    </header>

    <div class="hero">
        <h1 style="font-size: 50px; font-weight: 900; text-shadow: 2px 2px 10px #000;">مودك النهاردة؟</h1>
        <div class="search-area">
            <input type="text" id="searchInput" placeholder="ابحث عن فيلم، مسلسل، أنمي...">
            <button onclick="searchAction()"><i class="fas fa-search"></i></button>
        </div>
    </div>

    <section id="player-box">
        <div class="frame-wrapper">
            <iframe id="videoPlayer" src="" allowfullscreen></iframe>
        </div>
        <h2 id="movieTitle" style="margin-top: 25px; color: var(--gold);"></h2>
    </section>

    <div class="container">
        <h2 class="title">🔥 الأكثر طلباً عالمياً</h2>
        <div class="grid" id="trending"></div>
        
        <h2 class="title" style="margin-top: 60px;">🇸🇦 سينما عربية حصرية</h2>
        <div class="grid" id="arabic"></div>
    </div>

    <div id="kids-section">
        <div style="display:flex; justify-content: space-between; align-items: center;">
            <h1 style="color: var(--kids); font-size: 40px;">🍭 مودي كيدز</h1>
            <button onclick="toggleKids(false)" style="padding: 10px 25px; border-radius: 10px; background: red; color: white; border: none; cursor: pointer;">خروج</button>
        </div>
        <div class="grid" id="kids-grid" style="margin-top: 50px;"></div>
    </div>

    <footer>
        <p>MOODIE PLATFORM © 2026 | Powered by MOODIE API</p>
        <p style="margin-top: 10px;">Contact: modie.cinema@proton.me</p>
    </footer>

    <script>
        // الـ API Key الجديد بتاعك
        const MY_KEY = 'da87358fe15e91315b13c0b1f439b8fd';

        async function fetchMovies(url, elementId) {
            const res = await fetch(url);
            const data = await res.json();
            const grid = document.getElementById(elementId);
            grid.innerHTML = '';
            data.results.forEach(m => {
                if(!m.poster_path) return;
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => play(m.id, m.title || m.name, m.media_type);
                card.innerHTML = `
                    <div class="rating">${m.vote_average.toFixed(1)} <i class="fas fa-star"></i></div>
                    <img src="https://image.tmdb.org/t/p/w500${m.poster_path}">
                    <h3>${m.title || m.name}</h3>
                `;
                grid.appendChild(card);
            });
        }

        function play(id, title, type) {
            const playerBox = document.getElementById('player-box');
            const iframe = document.getElementById('videoPlayer');
            playerBox.style.display = 'block';
            // سيرفر بريميوم يدعم الترجمة العربية وجودة 4K
            const videoType = type === 'tv' ? 'tv' : 'movie';
            iframe.src = `https://vidsrc.to/embed/${videoType}/${id}`;
            document.getElementById('movieTitle').innerText = title;
            playerBox.scrollIntoView();
        }

        function searchAction() {
            const q = document.getElementById('searchInput').value;
            if(q) fetchMovies(`https://api.themoviedb.org/3/search/multi?api_key=${MY_KEY}&query=${q}&language=ar`, 'trending');
        }

        function toggleKids(show) {
            document.getElementById('kids-section').style.display = show ? 'block' : 'none';
        }

        window.onload = () => {
            fetchMovies(`https://api.themoviedb.org/3/trending/all/day?api_key=${MY_KEY}&language=ar`, 'trending');
            fetchMovies(`https://api.themoviedb.org/3/discover/movie?api_key=${MY_KEY}&with_original_language=ar`, 'arabic');
            fetchMovies(`https://api.themoviedb.org/3/discover/movie?api_key=${MY_KEY}&with_genres=16`, 'kids-grid');
        };
    </script>
</body>
</html>
