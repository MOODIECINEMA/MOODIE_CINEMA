<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoltFlix | منصة الترفيه الأولى</title>
    <link rel="icon" type="image/png" href="https://img.icons8.com/fluent/48/000000/movie-projector.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #E50914;
            --main-bg: #141414;
            --card-bg: #181818;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--main-bg); color: #fff; overflow-x: hidden; }

        /* سبلش سكرين حقيقية سريعة */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: #000; z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; transition: opacity 0.4s;
        }
        .splash-title { color: var(--primary); font-size: 4rem; font-weight: 900; letter-spacing: 3px; }

        /* الهيدر */
        header {
            position: fixed; top: 0; left: 0; width: 100%; padding: 20px 4%;
            display: flex; justify-content: space-between; align-items: center; z-index: 1000;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }
        .logo { color: var(--primary); font-size: 2rem; font-weight: 900; text-decoration: none; }
        
        .search-wrapper { position: relative; }
        .search-wrapper input {
            background: rgba(0,0,0,0.6); border: 1px solid #555; padding: 8px 15px;
            color: #fff; border-radius: 4px; outline: none; width: 240px; font-size: 0.9rem;
        }

        /* البانر العلوي الضخم */
        .hero-banner {
            height: 80vh; position: relative; background-size: cover; background-position: center;
            display: flex; align-items: center; padding: 0 4%;
        }
        .hero-banner::before {
            content: ""; position: absolute; top:0; left:0; width:100%; height:100%;
            background: linear-gradient(to right, rgba(20,20,20,0.9) 30%, transparent 100%),
                        linear-gradient(to top, var(--main-bg) 0%, transparent 40%);
        }
        .hero-text { position: relative; z-index: 10; max-width: 650px; }
        .hero-text h1 { font-size: 3.5rem; font-weight: 900; margin-bottom: 15px; line-height: 1.2; }
        .hero-text p { font-size: 1.1rem; color: #ccc; margin-bottom: 20px; }

        /* صفوف الأفلام الانزلاقية (شغل نتفليكس الحقيقي) */
        .content-area { padding: 0 4% 50px 4%; margin-top: -60px; position: relative; z-index: 100; }
        .row-container { margin-bottom: 40px; }
        .row-container h2 { font-size: 1.4rem; margin-bottom: 15px; font-weight: 700; }
        
        .slider-box {
            display: flex; gap: 12px; overflow-x: auto; padding: 10px 0;
            scroll-behavior: smooth;
        }
        .slider-box::-webkit-scrollbar { height: 6px; }
        .slider-box::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        
        .movie-poster {
            min-width: 180px; width: 180px; height: 260px; background: var(--card-bg);
            border-radius: 6px; overflow: hidden; cursor: pointer; transition: transform 0.3s;
            position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .movie-poster:hover { transform: scale(1.06); z-index: 10; }
        .movie-poster img { width: 100%; height: 100%; object-fit: cover; }
        .movie-title-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%; padding: 10px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            font-size: 0.85rem; font-weight: bold; text-align: center;
        }

        /* كارت العرض والمشغل (Modal) */
        .netflix-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: rgba(0,0,0,0.9); z-index: 5000; display: none;
            justify-content: center; align-items: center; padding: 20px;
        }
        .modal-card {
            background: var(--card-bg); width: 100%; max-width: 850px;
            border-radius: 8px; overflow: hidden; position: relative; max-height: 90vh; overflow-y: auto;
        }
        .close-btn {
            position: absolute; top: 15px; right: 15px; background: #000; color: #fff;
            border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; z-index: 200;
        }
        
        /* مكان المشغل السحري */
        .player-frame-wrapper {
            width: 100%; height: 450px; background: #000; display: none;
        }
        .player-frame-wrapper iframe { width: 100%; height: 100%; border: none; }

        .modal-backdrop-img { height: 350px; background-size: cover; background-position: center; position: relative; }
        .modal-backdrop-img::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, var(--card-bg), transparent);
        }

        .modal-details { padding: 30px; }
        .modal-details h2 { font-size: 2rem; margin-bottom: 15px; }
        .modal-details p { color: #bbb; line-height: 1.6; margin-bottom: 20px; }
        
        .play-now-btn {
            background: var(--primary); color: #fff; border: none; padding: 12px 30px;
            font-size: 1.1rem; font-weight: bold; border-radius: 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 10px;
        }
        .play-now-btn:hover { background: #b80710; }

        #search-screen { display: none; padding: 100px 4% 50px 4%; }
        .search-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
    </style>
</head>
<body>

    <!-- السبلش سكرين -->
    <div id="splash">
        <div class="splash-title">VOLTFLIX</div>
    </div>

    <!-- الهيدر -->
    <header>
        <a href="#" class="logo" onclick="window.location.reload()">VOLTFLIX</a>
        <div class="search-wrapper">
            <input type="text" id="live-search" placeholder="ابحث عن الأفلام الحركية والدراما...">
        </div>
    </header>

    <!-- شاشة البحث -->
    <main id="search-screen">
        <h2 style="margin-bottom: 20px;">نتائج البحث:</h2>
        <div class="search-grid" id="search-results-box"></div>
    </main>

    <!-- المحتوى الرئيسي للموقع -->
    <div id="main-site-content">
        <section class="hero-banner" id="hero-bg">
            <div class="hero-text">
                <h1 id="hero-title">جاري تحميل فيلم البانر...</h1>
                <p id="hero-desc">تصفح أقوى الأفلام الحصرية بجودة عالية مباشرة.</p>
                <button class="play-now-btn" id="hero-trigger-btn"><i class="fas fa-play"></i> عرض التفاصيل</button>
            </div>
        </section>

        <div class="content-area">
            <div class="row-container">
                <h2>الأفلام الشائعة المقترحة لك</h2>
                <div class="slider-box" id="trending-row"></div>
            </div>
            <div class="row-container">
                <h2>أفلام الحركة والإثارة (Action)</h2>
                <div class="slider-box" id="action-row"></div>
            </div>
        </div>
    </div>

    <!-- الكارت الضخم والمشغل المدمج -->
    <div class="netflix-modal" id="video-modal">
        <div class="modal-card">
            <button class="close-btn" onclick="closeScreen()"><i class="fas fa-times"></i></button>
            
            <!-- السيرفر المباشر الفعال -->
            <div class="player-frame-wrapper" id="player-container">
                <iframe id="stream-iframe" src="" allowfullscreen></iframe>
            </div>

            <div class="modal-backdrop-img" id="modal-img"></div>
            
            <div class="modal-details">
                <h2 id="modal-title">اسم العمل</h2>
                <p id="modal-desc">تفاصيل وقصة الفيلم كاملة...</p>
                <button class="play-now-btn" id="start-movie-btn"><i class="fas fa-play"></i> تشغيل الفيلم كاملاً</button>
            </div>
        </div>
    </div>

    <script>
        // مفاتيحك الشغالة تماماً
        const KEY = 'da87358fe15e91315b13c0b1f439b8fd';
        const BASE = 'https://api.themoviedb.org/3';
        const IMAGE_PATH = 'https://image.tmdb.org/t/p/w500';
        const HD_IMAGE_PATH = 'https://image.tmdb.org/t/p/original';

        // إخفاء السبلش سكرين فوراً عند الجاهزية
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const sp = document.getElementById('splash');
                sp.style.opacity = '0';
                setTimeout(() => sp.style.display = 'none', 400);
            }, 1200);
        });

        // دالة جلب وعرض الأفلام في الصفوف بطريقة تمنع ظهور صفحة بيضاء فاضية
        async function getMoviesData(path, containerId, isHero = false) {
            try {
                const res = await fetch(`${BASE}${path}?api_key=${KEY}&language=ar-SA`);
                const data = await res.json();
                
                if (!data.results || data.results.length === 0) {
                    throw new Error("داتا الـ API فارغة");
                }

                const movies = data.results;
                const container = document.getElementById(containerId);
                container.innerHTML = '';

                if(isHero) {
                    setHero(movies[0]);
                }

                movies.forEach(movie => {
                    if(!movie.poster_path) return;
                    
                    const p = document.createElement('div');
                    p.classList.add('movie-poster');
                    p.innerHTML = `
                        <img src="${IMAGE_PATH}${movie.poster_path}" alt="${movie.title}">
                        <div class="movie-title-overlay">${movie.title || movie.name}</div>
                    `;
                    p.onclick = () => openScreen(movie);
                    container.appendChild(p);
                });

            } catch (error) {
                console.error("حصلت مشكلة في الكول، بنشغل نظام الأمان الاحتياطي:", error);
                // خطة أمان احتياطية: لو سيرفر TMDB هنج، بنعرض أفلام داتا ثابتة عشان موقعك ميبقاش فاضي أبداً
                fillFallbackData(containerId);
            }
        }

        function setHero(movie) {
            document.getElementById('hero-bg').style.backgroundImage = `url('${HD_IMAGE_PATH}${movie.backdrop_path}')`;
            document.getElementById('hero-title').innerText = movie.title || movie.name;
            document.getElementById('hero-desc').innerText = movie.overview ? movie.overview.substring(0, 160) + '...' : 'فيلم شيق ومثير متاح للمشاهدة الفورية.';
            document.getElementById('hero-trigger-btn').onclick = () => openScreen(movie);
        }

        // فتح الكارت والمشغل
        function openScreen(movie) {
            const modal = document.getElementById('video-modal');
            document.getElementById('player-container').style.display = 'none';
            document.getElementById('stream-iframe').src = '';
            document.getElementById('modal-img').style.display = 'block';

            document.getElementById('modal-img').style.backgroundImage = `url('${HD_IMAGE_PATH}${movie.backdrop_path || movie.poster_path}')`;
            document.getElementById('modal-title').innerText = movie.title || movie.name;
            document.getElementById('modal-desc').innerText = movie.overview || 'فيلم رائع مليء بالأحداث، متاح للمشاهدة المباشرة الآن بجودة عالية.';
            
            // تشغيل السيرفر البديل المستقر جداً للأفلام المترجمة
            document.getElementById('start-movie-btn').onclick = function() {
                document.getElementById('modal-img').style.display = 'none';
                document.getElementById('player-container').style.display = 'block';
                
                // استخدام سيرفر vidsrc.cc أو vidsrc.me المستقر للبث المباشر المفتوح
                document.getElementById('stream-iframe').src = `https://vidsrc.me/embed/movie?tmdb=${movie.id}`;
            };

            modal.style.display = 'flex';
        }

        function closeScreen() {
            document.getElementById('video-modal').style.display = 'none';
            document.getElementById('stream-iframe').src = ''; // قفل الصوت فوراً
        }

        // محرك البحث اللحظي السريع
        document.getElementById('live-search').addEventListener('input', async (e) => {
            const val = e.target.value.trim();
            const main = document.getElementById('main-site-content');
            const searchScr = document.getElementById('search-screen');
            const resBox = document.getElementById('search-results-box');

            if(val.length < 2) {
                searchScr.style.display = 'none';
                main.style.display = 'block';
                return;
            }

            main.style.display = 'none';
            searchScr.style.display = 'block';

            try {
                const res = await fetch(`${BASE}/search/movie?api_key=${KEY}&language=ar&query=${encodeURIComponent(val)}`);
                const data = await res.json();
                resBox.innerHTML = '';

                if(data.results) {
                    data.results.forEach(movie => {
                        if(!movie.poster_path) return;
                        const p = document.createElement('div');
                        p.classList.add('movie-poster');
                        p.innerHTML = `
                            <img src="${IMAGE_PATH}${movie.poster_path}" alt="${movie.title}">
                            <div class="movie-title-overlay">${movie.title}</div>
                        `;
                        p.onclick = () => openScreen(movie);
                        resBox.appendChild(p);
                    });
                }
            } catch(e) { console.log("خطأ بحث"); }
        });

        // داتا الأمان الاحتياطية عشان شكل الموقع يفضل فخم وشغال حتى لو الـ API علق
        function fillFallbackData(containerId) {
            const box = document.getElementById(containerId);
            box.innerHTML = '';
            const backup = [
                {id: 550, title: "Fight Club", poster_path: "/pB8BM7pdSp6B66I097b9nbSJW0p.jpg", backdrop_path: "/hZ3feY47wUe3vGgGWvXQ6uC0S01.jpg", overview: "فيلم دراما كلاسيكي شهير."},
                {id: 27205, title: "Inception", poster_path: "/o06fVwW6wNo8m7mcl4gPIST1m8F.jpg", backdrop_path: "/s3TBrRGB1W7jWw1m7Up69m60Y8x.jpg", overview: "رحلة داخل عالم الأحلام وسرقتها."},
                {id: 157336, title: "Interstellar", poster_path: "/gEU2vYmBGa7vLMj6pG3X3vNfK87.jpg", backdrop_path: "/xJHokvJZgWx9Z6M6icE9Iu0z8R0.jpg", overview: "السفر عبر الثقوب الدودية لإنقاذ البشرية."}
            ];
            backup.forEach(movie => {
                const p = document.createElement('div');
                p.classList.add('movie-poster');
                p.innerHTML = `
                    <img src="https://image.tmdb.org/t/p/w500${movie.poster_path}" alt="${movie.title}">
                    <div class="movie-title-overlay">${movie.title}</div>
                `;
                p.onclick = () => openScreen(movie);
                box.appendChild(p);
            });
        }

        // تشغيل دوال الإقلاع الفورية لقنوات الأفلام
        getMoviesData('/movie/popular', 'trending-row', true);
        getMoviesData('/discover/movie', 'action-row', false, '&with_genres=28');

    </script>
</body>
        </html>
