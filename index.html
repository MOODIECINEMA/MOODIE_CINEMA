<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOODIE — تجربة سينمائية بريميوم</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Kufi+Arabic:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
      --bg: #070709; --surface: #0d0d12; --gold: #c9a84c; --text: #e0e0e0;
    }
    * { margin:0; padding:0; box-sizing:border-box; font-family: 'Noto Kufi Arabic', sans-serif; }
    body { background: var(--bg); color: var(--text); overflow-x: hidden; }

    /* Header Netflix Style */
    header {
      position: fixed; top: 0; width: 100%; z-index: 1000;
      padding: 20px 5%; display: flex; justify-content: space-between; align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
      transition: 0.4s;
    }
    .logo { font-family: 'Bebas Neue', sans-serif; font-size: 40px; color: var(--gold); letter-spacing: 3px; cursor: pointer; }
    
    .nav-tools { display: flex; gap: 20px; align-items: center; }
    .search-bar { background: rgba(255,255,255,0.05); border: 1px solid var(--c-border); border-radius: 4px; display: flex; align-items: center; padding: 5px 15px; }
    .search-bar input { background: transparent; border: none; color: white; outline: none; padding: 5px; width: 200px; }
    
    /* Hero Section */
    .hero {
      height: 85vh; width: 100%; position: relative;
      display: flex; align-items: center; padding: 0 5%;
      background-size: cover; background-position: center;
    }
    .hero::after { content: ''; position: absolute; inset:0; background: linear-gradient(to right, #070709 10%, transparent 60%), linear-gradient(to bottom, transparent 50%, #070709); }
    .hero-content { position: relative; z-index: 10; max-width: 700px; }
    .hero-content h1 { font-family: 'Bebas Neue', sans-serif; font-size: 80px; color: var(--gold); line-height: 1; margin-bottom: 20px; }
    .btn-play { background: var(--gold); color: black; padding: 15px 40px; font-weight: bold; border-radius: 4px; text-decoration: none; display: inline-flex; align-items: center; gap: 10px; transition: 0.3s; }
    .btn-play:hover { transform: scale(1.05); filter: brightness(1.2); }

    /* Rows Slider */
    .row { padding: 40px 0 20px 5%; }
    .row h2 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--gold); margin-bottom: 20px; letter-spacing: 1px; }
    .movie-container { display: flex; overflow-x: auto; gap: 15px; scrollbar-width: none; padding-bottom: 20px; }
    .movie-container::-webkit-scrollbar { display: none; }
    
    .card { min-width: 220px; height: 330px; background: var(--surface); border-radius: 8px; overflow: hidden; cursor: pointer; transition: 0.5s; position: relative; border: 1px solid rgba(255,255,255,0.05); }
    .card:hover { transform: scale(1.1); z-index: 100; border-color: var(--gold); }
    .card img { width: 100%; height: 100%; object-fit: cover; }
    .card-meta { position: absolute; bottom:0; width:100%; padding: 20px 10px; background: linear-gradient(to top, black, transparent); opacity: 0; transition: 0.3s; }
    .card:hover .card-meta { opacity: 1; }

    /* Fullscreen Player Modal */
    #player-modal {
      display: none; position: fixed; inset: 0; background: black; z-index: 5000;
    }
    .close-p { position: absolute; top: 20px; left: 20px; color: var(--gold); font-size: 35px; cursor: pointer; z-index: 6000; }
    .iframe-wrapper { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    iframe { width: 100%; height: 100%; border: none; }
    
    /* Watermark */
    .watermark {
      position: absolute; bottom: 30px; right: 30px;
      font-family: 'Bebas Neue', sans-serif; font-size: 24px;
      color: rgba(201, 168, 76, 0.3); pointer-events: none; z-index: 5500;
    }

    /* Kids Mode Overlay */
    #kids-mode { display:none; position:fixed; inset:0; background: #000510; z-index: 4000; padding: 5%; overflow-y: auto; }
  </style>
</head>
<body>

<header id="mainNav">
  <div class="logo">MOODIE</div>
  <div class="nav-tools">
    <div class="search-bar">
      <input type="text" id="apiSearch" placeholder="ابحث عن فيلمك..." onkeyup="if(event.key==='Enter') doSearch()">
      <i class="fas fa-search" style="color:var(--gold); cursor:pointer;" onclick="doSearch()"></i>
    </div>
    <button onclick="toggleKids(true)" style="background:var(--gold); border:none; padding:8px 15px; border-radius:4px; font-weight:bold; cursor:pointer;">KIDS</button>
  </div>
</header>

<section class="hero" id="hero">
  <div class="hero-content">
    <h1 id="heroTitle">LOADING...</h1>
    <p id="heroDesc" style="margin-bottom:20px; color:#aaa;"></p>
    <a href="javascript:void(0)" id="heroBtn" class="btn-play"><i class="fas fa-play"></i> شاهد الآن</a>
  </div>
</section>

<div class="row">
  <h2 id="rowTitle">الأكثر مشاهدة الآن</h2>
  <div class="movie-container" id="trendingBox"></div>
</div>

<div class="row">
  <h2>أفلام عربية</h2>
  <div class="movie-container" id="arabicBox"></div>
</div>

<div id="kids-mode">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h1 style="font-family:'Bebas Neue'; color:var(--gold); font-size:40px;">MOODIE KIDS</h1>
    <button onclick="toggleKids(false)" style="color:white; background:red; border:none; padding:10px 20px; border-radius:5px; cursor:pointer;">EXIT</button>
  </div>
  <div class="movie-container" id="kidsBox" style="margin-top:50px;"></div>
</div>

<div id="player-modal">
  <span class="close-p" onclick="closePlayer()">&times;</span>
  <div class="iframe-wrapper">
    <div class="watermark">MOODIE PREMIUM</div>
    <iframe id="mainIframe" allowfullscreen></iframe>
  </div>
</div>

<footer style="padding:60px; text-align:center; border-top:1px solid #111;">
  <p style="color:var(--gold); font-family:'Bebas Neue'; font-size:20px;">MOODIE PREMIUM CINEMA</p>
  <p style="color:#555; margin-top:10px;">Contact: modie.cinema@proton.me</p>
</footer>

<script>
  const API_KEY = 'da87358fe15e91315b13c0b1f439b8fd';
  const BASE_IMG = 'https://image.tmdb.org/t/p/original';

  async function loadGrid(url, boxId) {
    const res = await fetch(url);
    const data = await res.json();
    const box = document.getElementById(boxId);
    box.innerHTML = '';
    data.results.forEach(m => {
      if(!m.poster_path) return;
      const div = document.createElement('div');
      div.className = 'card';
      div.onclick = () => openPlayer(m.id, m.title || m.name, m.media_type);
      div.innerHTML = `<img src="${BASE_IMG + m.poster_path}"><div class="card-meta"><h4>${m.title || m.name}</h4><p>⭐ ${m.vote_average}</p></div>`;
      box.appendChild(div);
    });
  }

  async function loadHero() {
    const res = await fetch(`https://api.themoviedb.org/3/trending/all/day?api_key=${API_KEY}&language=ar`);
    const data = await res.json();
    const top = data.results[0];
    document.getElementById('hero').style.backgroundImage = `url(${BASE_IMG + top.backdrop_path})`;
    document.getElementById('heroTitle').innerText = top.title || top.name;
    document.getElementById('heroDesc').innerText = top.overview.slice(0, 150) + '...';
    document.getElementById('heroBtn').onclick = () => openPlayer(top.id, top.title || top.name, top.media_type);
  }

  function openPlayer(id, title, type) {
    const modal = document.getElementById('player-modal');
    const iframe = document.getElementById('mainIframe');
    const vType = type === 'tv' ? 'tv' : 'movie';
    // السيرفر الحقيقي اللي بيشغل الأفلام
    iframe.src = `https://vidsrc.to/embed/${vType}/${id}`;
    modal.style.display = 'block';
    document.body.style.overflow = 'hidden';
  }

  function closePlayer() {
    document.getElementById('player-modal').style.display = 'none';
    document.getElementById('mainIframe').src = '';
    document.body.style.overflow = '';
  }

  function doSearch() {
    const q = document.getElementById('apiSearch').value;
    if(q) {
      document.getElementById('rowTitle').innerText = 'نتائج البحث: ' + q;
      loadGrid(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${q}&language=ar`, 'trendingBox');
      window.scrollTo({top: 600, behavior: 'smooth'});
    }
  }

  function toggleKids(show) {
    document.getElementById('kids-mode').style.display = show ? 'block' : 'none';
  }

  window.onscroll = () => {
    const nav = document.getElementById('mainNav');
    if(window.scrollY > 80) nav.style.background = '#070709';
    else nav.style.background = 'linear-gradient(to bottom, rgba(0,0,0,0.8), transparent)';
  };

  window.onload = () => {
    loadHero();
    loadGrid(`https://api.themoviedb.org/3/trending/all/week?api_key=${API_KEY}&language=ar`, 'trendingBox');
    loadGrid(`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_original_language=ar`, 'arabicBox');
    loadGrid(`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=16`, 'kidsBox');
  };
</script>
</body>
</html>
