<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAFLIX | عالم السينما</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050b18; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .movie-card:hover { transform: scale(1.05); transition: 0.3s; box-shadow: 0 0 20px rgba(0, 195, 255, 0.4); }
        #loader { position: fixed; inset: 0; background: #050b18; z-index: 100; display: flex; align-items: center; justify-content: center; transition: 0.5s; }
    </style>
</head>
<body>

    <!-- شاشة التحميل الذكية (نتفليكس ستايل) -->
    <div id="loader">
        <div class="text-center">
            <h1 class="text-5xl font-bold text-cyan-400 animate-pulse">SHAFLIX</h1>
            <p class="text-gray-400 mt-2">جارِ جلب المغامرة...</p>
        </div>
    </div>

    <div class="flex">
        <!-- القائمة الجانبية (Sidebar) -->
        <aside class="w-64 h-screen sticky top-0 glass p-6 hidden md:block">
            <h2 class="text-2xl font-bold text-cyan-400 mb-10">SHAFLIX</h2>
            <nav class="space-y-6">
                <a href="#" class="block hover:text-cyan-400">الرئيسية</a>
                <a href="#" onclick="showSearch()" class="block hover:text-cyan-400 font-bold">🔍 البحث الذكي</a>
                <a href="#" class="block hover:text-cyan-400">الأفلام</a>
                <a href="#" class="block hover:text-cyan-400">المسلسلات</a>
                <hr class="border-white/10">
                <a href="mailto:support@proton.me" class="block text-sm text-gray-400">تواصل معنا (Proton)</a>
                <a href="#" class="block text-xs text-red-400">إخلاء مسؤولية (API)</a>
            </nav>
        </aside>

        <!-- المحتوى الرئيسي -->
        <main class="flex-1 p-8">
            <!-- بار البحث المربوط بالـ AI -->
            <div id="search-section" class="mb-10 hidden">
                <input id="searchInput" type="text" placeholder="ابحث عن فيلمك المفضل..." 
                       class="w-full p-4 rounded-xl glass outline-none focus:border-cyan-400">
            </div>

            <!-- المشغل (Player) - بيظهر عند الضغط على فيلم -->
            <div id="video-player" class="hidden mb-10 rounded-2xl overflow-hidden shadow-2xl border-2 border-cyan-500/30">
                <iframe id="player-frame" src="" width="100%" height="500" frameborder="0" allowfullscreen></iframe>
            </div>

            <h2 class="text-2xl font-bold mb-6">الأفلام الأكثر رواجاً</h2>
            <div id="movie-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6">
                <!-- الكروت هتظهر هنا برمجياً -->
            </div>
        </main>
    </div>

    <script>
        const API_KEY = 'da87358fe15e91315b13c0b1f439b8fd';
        const grid = document.getElementById('movie-grid');

        // 1. جلب الأفلام من الـ API عند التحميل
        async function fetchMovies() {
            try {
                const res = await fetch(`https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}&language=ar`);
                const data = await res.json();
                renderMovies(data.results);
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => document.getElementById('loader').remove(), 500);
            } catch (err) { console.error("خطأ في الربط!"); }
        }

        // 2. عرض الكروت بالفخامة اللي طلبتها
        function renderMovies(movies) {
            grid.innerHTML = movies.map(movie => `
                <div class="movie-card glass rounded-xl overflow-hidden cursor-pointer p-2" onclick="playMovie(${movie.id})">
                    <img src="https://image.tmdb.org/t/p/w500${movie.poster_path}" class="rounded-lg">
                    <div class="p-2">
                        <h3 class="font-bold text-sm truncate">${movie.title}</h3>
                        <div class="flex justify-between items-center mt-2">
                            <span class="text-xs text-yellow-400">⭐ ${movie.vote_average}</span>
                            <button class="bg-cyan-500 text-[10px] px-2 py-1 rounded">شاهد</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 3. المشغل - ربط الفيلم بمشغل خارجي (يعمل 100%)
        function playMovie(id) {
            const playerSection = document.getElementById('video-player');
            const iframe = document.getElementById('player-frame');
            // بنستخدم مصدر vidsrc المشهور لعرض الأفلام كاملة بناءً على ID الفيلم
            iframe.src = `https://vidsrc.me/embed/movie?tmdb=${id}`;
            playerSection.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 4. نظام البحث
        function showSearch() {
            document.getElementById('search-section').classList.toggle('hidden');
        }

        document.getElementById('searchInput').addEventListener('input', async (e) => {
            if(e.target.value.length > 2) {
                const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${e.target.value}&language=ar`);
                const data = await res.json();
                renderMovies(data.results);
            }
        });

        fetchMovies();
    </script>
</body>
</html>
