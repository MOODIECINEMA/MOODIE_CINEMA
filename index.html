<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOODIE | السينما العالمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #ffc107; --bg: #050505; --card-bg: #111; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg); color: white; overflow-x: hidden; }

        /* Navbar Netflix Style */
        nav { background: rgba(0,0,0,0.95); height: 70px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; position: fixed; width: 100%; z-index: 2000; border-bottom: 1px solid #222; }
        .logo { font-size: 30px; font-weight: 900; color: var(--gold); cursor: pointer; }
        .search-container { display: flex; background: #1a1a1a; border-radius: 20px; padding: 5px 15px; border: 1px solid #333; width: 40%; }
        .search-container input { background: transparent; border: none; color: white; flex: 1; outline: none; padding: 5px; }
        .search-container i { color: var(--gold); cursor: pointer; }

        /* Hero */
        .hero { height: 60vh; background: linear-gradient(to bottom, transparent, var(--bg)), url('https://image.tmdb.org/t/p/original/muth4M9rSda9z9G6Jm2Sj6vKpP9.jpg'); background-size: cover; background-position: center; display: flex; align-items: center; padding: 0 5%; margin-top: 70px; }
        .hero h1 { font-size: clamp(30px, 5vw, 60px); font-weight: 900; }

        /* Movie Grid */
        .container { padding: 30px 5%; }
        .section-title { font-size: 24px; color: var(--gold); margin-bottom: 20px; border-right: 4px solid var(--gold); padding-right: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        .card { background: var(--card-bg); border-radius: 10px; overflow: hidden; cursor: pointer; transition: 0.3s; border: 1px solid #222; }
        .card:hover { transform: translateY(-10px); border-color: var(--gold); }
        .card img { width: 100%; height: 240px; object-fit: cover; }
        .card h3 { padding: 10px; font-size: 13px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Advanced Player with Watermark */
        #player-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 3000; padding: 20px; }
        .video-box { position: relative; max-width: 1100px; margin: 50px auto; border: 2px solid var(--gold); border-radius: 15px; overflow: hidden; }
        iframe { width: 100%; aspect-ratio: 16/9; border: none; }
        
        /* العلامة المائية - Watermark */
        .watermark { 
            position: absolute; top: 20px; right: 20px; 
            font-size: 18px; font-weight: 900; color: rgba(255, 193, 7, 0.3); 
            pointer-events: none; user-select: none; z-index: 10;
            text-transform: uppercase; letter-spacing: 2px;
        }

        .close-btn { position: absolute; top: 20px; left: 20px; font-size: 35px; color: var(--gold); cursor: pointer; z-index: 4000; }
        
        footer { padding: 40px; text-align: center; color: #444; border-top: 1px solid #111; }
    </style>
</head>
<body>

<nav>
    <div class="logo" onclick="location.reload()">MOODIE</div>
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="ابحث عن أفلام، مسلسلات..." onkeyup="if(event.key === 'Enter') search()">
        <i class="fas fa-search" onclick="search()"></i>
    </div>
</nav>

<div class="hero">
    <h1>استمتع بمشاهدة <br><span style="color:var(--gold)">بلا حدود</span></h1>
</div>

<div class="container" id="main-content">
    <h2 class="section-title" id="grid-title">🔥 الأكثر طلباً الآن</h2>
    <div class="grid" id="movieGrid"></div>
</div>

<div id="player-overlay">
    <span class="close-btn" onclick="closePlayer()">&times;</span>
    <div class="video-box">
        <div class="watermark">MOODIE PREMIUM</div> <iframe id="videoPlayer" src="" allowfullscreen></iframe>
    </div>
    <h2 id="currentMovieTitle" style="text-align: center; color: var(--gold);"></h2>
</div>

<footer>
    <p>© 2026 MOODIE | Powered by da87358fe15e91315b13c0b1f439b8fd</p>
</footer>

<script>
    const API_KEY = 'da87358fe15e91315b13c0b1f439b8fd';

    async function fetchMovies(url) {
        const res = await fetch(url);
        const data = await res.json();
        const grid = document.getElementById('movieGrid');
        grid.innerHTML = '';
        data.results.forEach(m => {
            if(!m.poster_path) return;
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => play(m.id, m.title || m.name, m.media_type);
            card.innerHTML = `
                <img src="https://image.tmdb.org/t/p/w500${m.poster_path}">
                <h3>${m.title || m.name}</h3>
            `;
            grid.appendChild(card);
        });
    }

    // وظيفة البحث الذكي
    function search() {
        const query = document.getElementById('searchInput').value;
        if(query) {
            document.getElementById('grid-title').innerText = `نتائج البحث عن: ${query}`;
            fetchMovies(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${query}&language=ar`);
            window.scrollTo({top: 500, behavior: 'smooth'});
        }
    }

    function play(id, title, type) {
        const overlay = document.getElementById('player-overlay');
        const player = document.getElementById('videoPlayer');
        const vType = type === 'tv' ? 'tv' : 'movie';
        overlay.style.display = 'block';
        player.src = `https://vidsrc.to/embed/${vType}/${id}`;
        document.getElementById('currentMovieTitle').innerText = title;
        document.body.style.overflow = 'hidden';
    }

    function closePlayer() {
        document.getElementById('player-overlay').style.display = 'none';
        document.getElementById('videoPlayer').src = '';
        document.body.style.overflow = 'auto';
    }

    window.onload = () => fetchMovies(`https://api.themoviedb.org/3/trending/all/week?api_key=${API_KEY}&language=ar`);
</script>

</body>
</html>
