<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOODIE | مودك للسينما</title>
    
    <link rel="icon" type="image/png" href="https://i.imgur.com/your-logo-link.png">
    
    <style>
        :root { --gold: #d4af37; --dark: #0a0a0a; }
        body { background: var(--dark); color: white; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding-top: 80px; }
        
        header { 
            position: fixed; top: 0; width: 100%; height: 75px; 
            background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(15px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 5%; border-bottom: 2px solid rgba(212, 175, 55, 0.3); z-index: 1000;
        }
        .logo-area { display: flex; align-items: center; }
        .logo-img { width: 45px; height: 45px; border-radius: 10px; border: 1.5px solid var(--gold); margin-left: 15px; }
        .site-name { color: var(--gold); font-size: 26px; font-weight: 900; }
        
        .kids-btn { background: linear-gradient(45deg, #ffcc00, #ff9900); color: black; padding: 10px 20px; border-radius: 25px; font-weight: bold; text-decoration: none; }
        
        .main-content { text-align: center; padding: 20px; }
        .player-container { width: 95%; max-width: 1100px; margin: 0 auto; background: #000; border-radius: 20px; overflow: hidden; border: 1px solid #333; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        iframe { width: 100%; height: 550px; border: none; }
        
        footer { padding: 50px 5%; background: #050505; text-align: center; border-top: 1px solid #1a1a1a; margin-top: 50px; }
        .social-box { display: flex; justify-content: center; gap: 30px; margin-bottom: 20px; }
        .social-box a { color: white; text-decoration: none; font-size: 16px; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <img src="https://i.imgur.com/your-logo-link.png" alt="M" class="logo-img">
            <span class="site-name">MOODIE</span>
        </div>
        <a href="#" class="kids-btn">🧒 ركن الأطفال</a>
    </header>

    <main class="main-content">
        <h1 style="color: var(--gold); margin-bottom: 30px;">مودك للسينما | فيلمك موجود</h1>
        <div class="player-container">
            <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
        </div>
    </main>

    <footer>
        <div style="color: var(--gold); margin-bottom: 20px;">تواصل مع إدارة MOODIE</div>
        <div class="social-box">
            <a href="#">𝕏 تويتر</a>
            <a href="#">✈️ تليجرام</a>
            <a href="mailto:modie.cinema@proton.me">📧 البريد</a>
        </div>
        <p style="font-size: 12px; color: #444;">© 2026 MOODIE - تجربة سينمائية بريميوم</p>
    </footer>

</body>
</html>
