<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOODIE | عالم السينما اللامحدود</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #d4af37; --bg: #050505; --card: #121212; --kids: #00d4ff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg); color: white; overflow-x: hidden; }

        /* الهيدر الفخم */
        header { 
            position: fixed; top: 0; width: 100%; height: 75px; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.95), transparent);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 5%; z-index: 2000; transition: 0.4s;
        }
        .logo { font-size: 30px; font-weight: 900; color: var(--gold); text-shadow: 0 0 15px rgba(212,175,55,0.4); }

        /* البحث الاحترافي */
        .search-container { 
            background: linear-gradient(to bottom, #111, var(--bg));
            padding: 100px 5% 30px; text-align: center;
        }
        .search-box { 
            max-width: 700px; margin: 0 auto; display: flex; 
            background: #1a1a1a; border-radius: 50px; border: 1px solid var(--gold); overflow: hidden;
        }
        .search-box input { 
            flex: 1; background: transparent; border: none; padding: 15px 25px; 
            color: white; font-size: 16px; outline: none;
        }
        .search-box button { background: var(--gold); border: none; padding: 0 30px; cursor: pointer; font-weight: bold; }

        /* المشغل الفخم */
        .player-wrapper { padding: 20px 5%; }
        .main-player { 
            width: 100%; max-width: 1100px; margin: 0 auto; background: #000;
            border-radius: 20px; overflow: hidden; border: 2px solid #222; position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        .main-player iframe { width: 100%; aspect-ratio: 16/9; border: none; }
        .movie-title { margin-top: 15px; text-align: center; color: var(--gold); font-size: 24px; font-weight: 900; }

        /* صفوف الأفلام (ستايل نتفليكس) */
        .section-title { padding: 20px 5% 10px; font-size: 22px; font-weight: bold; color: #eee; display: flex; align-items: center; gap: 10px; }
        .section-title::before { content: ''; width: 4px; height: 25px; background: var(--gold); display: block; }
        
        .movie-row { 
            display: flex; overflow-x: auto; gap: 15px; padding: 10px 5% 30px;
            scrollbar-width: none;
        }
        .movie-row::-webkit-scrollbar { display: none; }
        
        .movie-card { 
            flex: 0 0 auto; width: 180px; background: var(--card); 
            border-radius: 12px; overflow: hidden; cursor: pointer;
            transition: 0.3s; border: 1px solid #222;
        }
        .movie-card:hover { transform: scale(1.1); border-color: var(--gold); z-index: 10; }
        .movie-card img { width: 100%; height: 260px; object-fit: cover; }
        .card-name { padding: 10px; font-size: 13px; text-align: center; font-weight: bold; }

        /* ركن الأطفال الناعم */
        .kids-nav { background: var(--kids); color: black; padding: 5px 15px; border-radius: 20px; font-weight: 900; cursor: pointer; border: none; }
        #kids-section { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #001220; z-index: 3000; display: none; padding: 50px; overflow-y: auto; }

        /* أماكن الإعلانات */
        .ad-spot { width: 100%; max-width: 970px; height: 90px; background: #080808; margin: 20px auto; border: 1px dashed #333; display: flex; align-items: center; justify-content: center; color: #444; font-size: 12px; }

        footer { padding: 50px; text-align: center; background: #000; border-top: 1px solid #111; color: #666; }
    </style>
</head>
<body>

    <header id="header">
        <div class="logo">MOODIE</div>
        <button class="kids-nav" onclick="showKids(true)">🧒 ركن الأطفال</button>
    </header>

    <div class="search-container">
        <div class="ad-spot">إعلان علوي (Adsterra 728x90)</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن أي فيلم أو مسلسل في العالم...">
            <button onclick="searchMovie()"><i class="fas fa-search"></i></button>
        </div>
    </div>

    <div class="player-wrapper">
        <div class="main-player">
            <iframe id="mainIframe" src="https://vidsrc.me/embed/movie?imdb=tt15239678" allowfullscreen></iframe>
        </div>
        <div id="pTitle" class="movie-title">Dune: Part Two (2024)</div>
    </div>

    <div class="section-title">🔥 الأكثر شهرة عالمياً</div>
    <div class="movie-row" id="trending-row">
        </div>

    <div class="ad-spot">إعلان منتصف الصفحة (Adsterra Native)</div>

    <div class="section-title">🇸🇦 حصريات عربية</div>
    <div class="movie-row" id="arabic-row">
        </div>

    <div id="kids-section">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1 style="color: var(--kids);">🍭 مودي كيدز</h1>
            <button onclick="showKids(false)" style="background:red; color:white; border:none; padding:10px 20px; border-radius:10px; cursor:pointer;">خروج</button>
        </div>
        <div class="movie-row" id="kids-row" style="margin-top: 40px;"></div>
    </div>

    <footer>
        <div class="logo" style="font-size: 40px; margin-bottom: 20px;">MOODIE</div>
        <p>جميع حقوق المحتوى محفوظة لـ MOODIE 2026</p>
        <div class="ad-spot" style="height: 50px; border:none;">Adsterra Footer Ads</div>
    </footer>

    <script>
        // مفتاح الـ API (ده شغال ومجاني حالياً)
        const API_KEY = '8d398e30ad929d674454995574366914'; 
        
        async function fetchMovies(url, containerId) {
            const res = await fetch(url);
            const data = await res.json();
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            data.results.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => play(movie.id, movie.title || movie.name, movie.media_type || 'movie');
                card.innerHTML = `
                    <img src="https://image.tmdb.org/t/p/w500${movie.poster_path}" alt="${movie.title}">
                    <div class="card-name">${movie.title || movie.name}</div>
                `;
                container.appendChild(card);
            });
        }

        function play(id, title, type) {
            const player = document.getElementById('mainIframe');
            // ده سيرفر "عملاق" فيه كل حاجة في الدنيا حرفياً
            if(type === 'tv') {
                player.src = `https://vidsrc.to/embed/tv/${id}`;
            } else {
                player.src = `https://vidsrc.to/embed/movie/${id}`;
            }
            document.getElementById('pTitle').innerText = title;
            window.scrollTo({top: 150, behavior: 'smooth'});
        }

        async function searchMovie() {
            const query = document.getElementById('searchInput').value;
            if(!query) return;
            const url = `https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${query}&language=ar`;
            fetchMovies(url, 'trending-row');
            document.querySelector('.section-title').innerText = `نتائج البحث عن: ${query}`;
        }

        function showKids(status) {
            document.getElementById('kids-section').style.display = status ? 'block' : 'none';
        }

        // تحميل البيانات عند فتح الموقع
        window.onload = () => {
            // أفلام عالمية
            fetchMovies(`https://api.themoviedb.org/3/trending/all/day?api_key=${API_KEY}&language=ar`, 'trending-row');
            // أفلام عربية (فلتر لغة)
            fetchMovies(`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_original_language=ar`, 'arabic-row');
            // أطفال
            fetchMovies(`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=16`, 'kids-row');
        };

        window.onscroll = () => {
            const header = document.getElementById('header');
            if(window.scrollY > 50) header.style.background = '#000';
            else header.style.background = 'linear-gradient(to bottom, rgba(0,0,0,0.95), transparent)';
        };
    </script>
</body>
</html>
