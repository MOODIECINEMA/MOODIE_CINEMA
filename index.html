<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOODIE | Ultimate Cinema</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffc107; --bg: #050505; }
        body { background: var(--bg); color: white; margin: 0; font-family: 'Cairo', sans-serif; }
        header { background: #000; padding: 20px; text-align: center; border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 100; }
        .hero { padding: 50px 20px; text-align: center; background: linear-gradient(rgba(0,0,0,0.7), var(--bg)), url('https://w0.peakpx.com/wallpaper/289/663/HD-wallpaper-the-batman-2022-movie-poster.jpg'); background-size: cover; }
        .search-area { margin-top: 20px; }
        input { padding: 15px; width: 70%; max-width: 500px; border-radius: 30px; border: 1px solid var(--gold); background: #111; color: white; outline: none; }
        button { padding: 15px 30px; border-radius: 30px; border: none; background: var(--gold); font-weight: bold; cursor: pointer; margin-right: -50px; }
        .section-title { padding: 30px 5% 10px; color: var(--gold); font-size: 24px; border-right: 5px solid var(--gold); margin: 20px 5% 0 0; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; padding: 20px 5%; }
        .card { background: #111; border-radius: 12px; overflow: hidden; border: 1px solid #222; transition: 0.3s; cursor: pointer; position: relative; }
        .card:hover { transform: scale(1.05); border-color: var(--gold); }
        .card img { width: 100%; height: 240px; object-fit: cover; }
        .card-info { padding: 10px; font-size: 14px; text-align: center; }
        #player-section { display: none; padding: 20px 5%; background: #000; }
        iframe { width: 100%; aspect-ratio: 16/9; border: 2px solid var(--gold); border-radius: 15px; }
    </style>
</head>
<body>

<header><h1 style="color: var(--gold); margin: 0;">MOODIE PREMIUM</h1></header>

<div id="player-section">
    <iframe id="main-player" src="" allowfullscreen></iframe>
    <h2 id="movie-name" style="text-align: center; color: var(--gold);"></h2>
</div>

<div class="hero">
    <h1 style="font-size: 40px;">السينما العالمية بين يديك</h1>
    <div class="search-area">
        <input type="text" id="searchInput" placeholder="ابحث عن أي فيلم بالاسم...">
        <button onclick="search()">بحث</button>
    </div>
</div>

<div class="section-title">🔥 أحدث الأفلام العالمية (تحديث تلقائي)</div>
<div class="movie-grid" id="trending"></div>

<script>
    const API_KEY = '8d398e30ad929d674454995574366914';

    async function getMovies(url, containerId) {
        const res = await fetch(url);
        const data = await res.json();
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // تنظيف الشبكة
        data.results.forEach(m => {
            if(!m.poster_path) return;
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => {
                const section = document.getElementById('player-section');
                section.style.display = 'block';
                document.getElementById('main-player').src = `https://vidsrc.to/embed/movie/${m.id}`;
                document.getElementById('movie-name').innerText = m.title || m.name;
                section.scrollIntoView({behavior: 'smooth'});
            };
            card.innerHTML = `<img src="https://image.tmdb.org/t/p/w500${m.poster_path}"><div class="card-info">${m.title || m.name}</div>`;
            container.appendChild(card);
        });
    }

    function search() {
        const q = document.getElementById('searchInput').value;
        if(q) getMovies(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${q}&language=ar`, 'trending');
    }

    window.onload = () => getMovies(`https://api.themoviedb.org/3/trending/movie/week?api_key=${API_KEY}&language=ar`, 'trending');
</script>
</body>
</html>
