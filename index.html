<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- أهم أكواد الـ SEO ليتصدر الموقع في جوجل -->
    <title>CineVerse | عالم الأفلام والمسلسلات الحصرية مجاناً</title>
    <meta name="description" content="منصة CineVerse لمشاهدة أحدث الأفلام والمسلسلات بجودة عالية وبدون إعلانات مزعجة. شاهد أفلامك المفضلة وتصفح أكبر مكتبة سينمائية.">
    <meta name="keywords" content="CineVerse, سينيفيرس, أفلام ومسلسلات, مشاهدة أفلام اون لاين, نتفليكس مجانا, أفلام مترجمة">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph (عشان لما تشير رابط الموقع على الفيس أو الواتس يظهر بشكل احترافي) -->
    <meta property="og:title" content="CineVerse | عالم الأفلام والمسلسلات الحصرية">
    <meta property="og:description" content="شاهد أحدث الأفلام والمسلسلات بجودة عالية مجاناً على CineVerse.">
    <meta property="og:type" content="website">
    
    <!-- خطوط وجوجل وأيقونات -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبة مشغل الفيديو النظيف Plyr -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

    <style>
        :root {
            --primary-color: #E50914; /* أحمر نتفليكس الشهير */
            --background-color: #111;
            --card-bg: #181818;
            --text-color: #fff;
            --text-muted: #aaa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            overflow-x: hidden;
        }

        /* 1. صفحة التحميل (Splash Screen) */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        .splash-logo {
            color: var(--primary-color);
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 2px;
            animation: zoomIn 1.5s ease-in-out infinite alternate;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top: 5px solid var(--primary-color);
            border-radius: 50%;
            margin-top: 20px;
            animation: spin 1.3s linear infinite;
        }

        /* 2. الهيدر (Navbar) */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 4%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
            transition: background 0.3s;
        }
        header.black-bg {
            background-color: var(--background-color);
            padding: 15px 4%;
            border-bottom: 1px solid #222;
        }
        .logo {
            color: var(--primary-color);
            font-size: 2rem;
            font-weight: 900;
            text-decoration: none;
        }

        /* 3. الواجهة الضخمة (Hero Section) */
        .hero {
            position: relative;
            height: 85vh;
            display: flex;
            align-items: center;
            padding: 0 4%;
            background-size: cover;
            background-position: center center;
        }
        .hero::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to right, rgba(0,0,0,0.8) 30%, transparent 100%),
                        linear-gradient(to top, var(--background-color) 0%, transparent 20%);
        }
        .hero-content {
            position: relative;
            z-index: 10;
            max-width: 600px;
        }
        .hero-title {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 15px;
            line-height: 1.2;
        }
        .hero-overview {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 25px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
        }
        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-primary:hover { background-color: #b80710; }

        /* 4. صفوف الأفلام (Rows & Cards) */
        .main-container {
            padding: 0 4% 50px 4%;
            margin-top: -50px;
            position: relative;
            z-index: 20;
        }
        .row-title {
            font-size: 1.5rem;
            margin: 25px 0 15px 0;
            font-weight: 700;
        }
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }
        .movie-card {
            background-color: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease;
            position: relative;
        }
        .movie-card:hover {
            transform: scale(1.05);
            z-index: 30;
        }
        .movie-card img {
            width: 100%;
            height: 270px;
            object-fit: cover;
            display: block;
        }
        .movie-info {
            padding: 10px;
        }
        .movie-info h4 {
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 5. كارت تفاصيل الفيلم الضخم (Netflix Style Modal) */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .modal.open { opacity: 1; visibility: visible; }
        .modal-content {
            background-color: var(--card-bg);
            width: 90%;
            max-width: 850px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            transform: translateY(50px);
            transition: transform 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal.open .modal-content { transform: translateY(0); }
        .modal-banner {
            position: relative;
            height: 400px;
            background-size: cover;
            background-position: center;
        }
        .modal-banner::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, var(--card-bg) 0%, transparent 100%);
        }
        .close-modal {
            position: absolute;
            top: 20px; right: 20px;
            background: #000; color: #fff;
            border: none; width: 40px; height: 40px;
            border-radius: 50%; cursor: pointer;
            font-size: 1.2rem; z-index: 100;
        }
        .modal-body {
            padding: 30px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }
        @media(max-width: 768px) {
            .modal-body { grid-template-columns: 1fr; }
            .modal-banner { height: 250px; }
        }
        .detail-title { font-size: 2.2rem; font-weight: 900; margin-bottom: 15px; }
        .detail-overview { color: var(--text-muted); line-height: 1.6; margin-bottom: 20px; }
        .meta-info p { margin-bottom: 8px; font-size: 0.95rem; }
        .meta-info span { color: var(--text-muted); }
        .badge { background: #464646; padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; }
        .rating { color: #46d369; font-weight: bold; }

        /* 6. مشغل الفيديو */
        .video-container {
            display: none;
            width: 100%;
            background: #000;
            padding: 10px 0;
        }

        /* حركات الأنميشن */
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes zoomIn { from { transform: scale(0.95); } to { transform: scale(1.05); } }
    </style>
</head>
<body>

    <!-- 1. صفحة التحميل -->
    <div id="splash-screen">
        <div class="splash-logo">CINEVERSE</div>
        <div class="spinner"></div>
    </div>

    <!-- 2. الهيدر -->
    <header id="main-header">
        <a href="#" class="logo">CINEVERSE</a>
    </header>

    <!-- 3. الواجهة الضخمة (Hero Section) -->
    <section class="hero" id="hero-section">
        <div class="hero-content">
            <h1 class="hero-title" id="hero-title">جاري التحميل...</h1>
            <p class="hero-overview" id="hero-overview">...</p>
            <button class="btn btn-primary" id="hero-play-btn"><i class="fas fa-play"></i> تشغيل الآن</button>
        </div>
    </section>

    <!-- 4. محتوى الحاويات والأفلام -->
    <div class="main-container">
        <h2 class="row-title">الأفلام الأكثر شيوعاً الأن</h2>
        <div class="movies-grid" id="trending-grid"></div>

        <h2 class="row-title">الأعلى تقييماً</h2>
        <div class="movies-grid" id="top-rated-grid"></div>
    </div>

    <!-- 5. كارت تفاصيل الفيلم الضخم (Netflix Modal) -->
    <div class="modal" id="movie-modal">
        <div class="modal-content">
            <button class="close-modal" id="close-modal-btn"><i class="fas fa-times"></i></button>
            <div class="modal-banner" id="modal-banner"></div>
            
            <!-- مشغل الفيديو الذكي المدمج بالموقع -->
            <div class="video-container" id="video-player-wrapper">
                <video id="player" playsinline controls></video>
            </div>

            <div class="modal-body">
                <div>
                    <h2 class="detail-title" id="modal-title">اسم الفيلم</h2>
                    <p class="detail-overview" id="modal-overview">قصة الفيلم هنا...</p>
                    <button class="btn btn-primary" id="modal-play-btn" style="margin-top: 10px;"><i class="fas fa-play"></i> ابدأ المشاهدة الآن</button>
                </div>
                <div class="meta-info">
                    <p><span class="rating">تقييم:</span> <span id="modal-rating">0.0</span></p>
                    <p><span>تاريخ الإصدار:</span> <span id="modal-date">-</span></p>
                    <p><span>اللغة الأصلية:</span> <span id="modal-lang" class="badge">-</span></p>
                </div>
            </div>
        </div>
    </div>

    <!-- مكتبات التشغيل والتحكم -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        // إعدادات الـ API الخاصة بك
        const API_KEY = 'da87358fe15e91315b13c0b1f439b8fd';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/original';
        const POSTER_URL = 'https://image.tmdb.org/t/p/w500';

        // تهيئة مشغل الفيديو النظيف Plyr
        const player = new Plyr('#player', {
            controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen']
        });

        // إخفاء صفحة التحميل بعد دقيقة ونصف تلقائياً أو عند تحميل البيانات
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.visibility = 'hidden', 500);
            }, 1000);
        });

        // تأثير الهيدر عند التمرير لأسفل
        window.addEventListener('scroll', () => {
            const header = document.getElementById('main-header');
            if (window.scrollY > 50) {
                header.classList.add('black-bg');
            } else {
                header.classList.remove('black-bg');
            }
        });

        // جلب البيانات من الـ API
        async function fetchMovies(endpoint, gridId, isHero = false) {
            try {
                const response = await fetch(`${BASE_URL}${endpoint}?api_key=${API_KEY}&language=ar`);
                const data = await response.json();
                const movies = data.results;

                if (isHero && movies.length > 0) {
                    setupHero(movies[0]);
                }

                const grid = document.getElementById(gridId);
                grid.innerHTML = '';
                
                movies.forEach(movie => {
                    if(!movie.poster_path) return;
                    
                    const card = document.createElement('div');
                    card.classList.add('movie-card');
                    card.innerHTML = `
                        <img src="${POSTER_URL}${movie.poster_path}" alt="${movie.title}">
                        <div class="movie-info">
                            <h4>${movie.title || movie.name}</h4>
                        </div>
                    `;
                    card.addEventListener('click', () => openModal(movie));
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error("حدث خطأ أثناء جلب الأفلام:", error);
            }
        }

        // إعداد الهيرو الافتتاحي فوق
        function setupHero(movie) {
            const hero = document.getElementById('hero-section');
            hero.style.backgroundImage = `url('${IMG_URL}${movie.backdrop_path}')`;
            document.getElementById('hero-title').innerText = movie.title;
            document.getElementById('hero-overview').innerText = movie.overview ? movie.overview.substring(0, 150) + '...' : 'لا يوجد وصف متاح حالياً.';
            
            document.getElementById('hero-play-btn').onclick = () => openModal(movie);
        }

        // فتح كارت تفاصيل الفيلم والمشغل
        function openModal(movie) {
            const modal = document.getElementById('movie-modal');
            document.getElementById('modal-banner').style.backgroundImage = `url('${IMG_URL}${movie.backdrop_path || movie.poster_path}')`;
            document.getElementById('modal-title').innerText = movie.title || movie.name;
            document.getElementById('modal-overview').innerText = movie.overview || 'قصة الفيلم غير متوفرة باللغة العربية حالياً.';
            document.getElementById('modal-rating').innerText = movie.vote_average.toFixed(1);
            document.getElementById('modal-date').innerText = movie.release_date || movie.first_air_date || 'غير معروف';
            document.getElementById('modal-lang').innerText = movie.original_language.toUpperCase();

            // إخفاء المشغل وتصفيره عند فتح الكارت أول مرة
            document.getElementById('video-player-wrapper').style.display = 'none';
            player.source = {}; 

            // زرار تشغيل الفيلم داخل الكارت الاحترافي
            document.getElementById('modal-play-btn').onclick = function() {
                startStreaming(movie.id);
            };

            modal.classList.add('open');
        }

        // إغلاق الكارت
        document.getElementById('close-modal-btn').addEventListener('click', () => {
            document.getElementById('movie-modal').classList.remove('open');
            player.stop(); // إيقاف الفيديو فوراً عند القفل
        });

        // 🛑 سر المشغل وحل معضلة الفيديوهات بدون إعلانات 🛑
        function startStreaming(movieId) {
            const videoWrapper = document.getElementById('video-player-wrapper');
            videoWrapper.style.display = 'block';
            
            // بنستخدم سيرفر بث Super Embed نظيف وبيمرر الفيديو للمشغل الداخلي بتاعنا مباشرة
            // السيرفر ده بيجيب الفيلم أوتوماتيك بناءً على رقم الـ ID الخاص بـ TMDB
            const streamUrl = `https://multiembed.mov/?video_id=${movieId}&tmdb=1`;
            
            // إدراج السيرفر كـ Source للمشغل النظيف لقمع الإعلانات
            player.source = {
                type: 'video',
                sources: [
                    {
                        src: streamUrl,
                        type: 'video/mp4',
                    }
                ],
            };
            
            // سكرول تلقائي للمشغل عشان تجربة مستخدم ممتازة
            videoWrapper.scrollIntoView({ behavior: 'smooth' });
            player.play();
        }

        // تشغيل كل السكربتات عند الإقلاع
        fetchMovies('/movie/trending', 'trending-grid', true);
        fetchMovies('/movie/top_rated', 'top-rated-grid', false);
    </script>
</body>
</html>
